  {t:'aula', titulo:'Dicionários', rot:['Python','Em português'], paras:['Um dicionário guarda pares chave: valor entre chaves { }. Você acessa o valor pela chave: estoque["caju"].','Para criar ou mudar um valor, use estoque["suco"] = 4. Para saber se uma chave existe, use "suco" in estoque. Dados de arquivos CSV costumam virar dicionários: cada linha é cortada com split(",").'],
    fatos:[['Criar','{"caju": 3, "suco": 4}'],['Ler','estoque["caju"]'],['Mudar','estoque["caju"] = 5'],['Existe?','"caju" in estoque']],
    portugol:'estoque = {"caju": 3, "cocada": 5}\nestoque["caju"] = estoque["caju"] + 2   # agora 5\nestoque["suco"] = 4                     # chave nova\nif "bolo" in estoque:\n    print("tem bolo")\nfor item, qtd in estoque.items():\n    print(item, qtd)\n\n# lendo um arquivo CSV de pedidos\nwith open("pedidos.csv") as arquivo:\n    for linha in arquivo:\n        cliente, valor = linha.strip().split(",")',
    python:'# Em português:\n# crie um estoque com caju (3) e cocada (5)\n# some 2 ao caju\n# crie a chave suco com o valor 4\n# se existir a chave bolo, avise\n# para cada item e quantidade do estoque, mostre os dois\n#\n# abra o arquivo pedidos.csv\n# para cada linha do arquivo:\n#     tire o "enter" do fim e corte na vírgula',
    real:'APIs, bancos de dados e arquivos JSON usam a mesma ideia de chave e valor. Quem domina dicionários entende JSON em minutos.'},
  {t:'mesa', titulo:'Teste de mesa: o estoque muda', instr:'Siga o código e escreva o valor de cada chave depois de cada linha. Use "—" quando a chave ainda não existir.', codigo:'estoque = {"caju": 3, "cocada": 5}\nestoque["caju"] = estoque["caju"] + 2\nestoque["suco"] = 4\nestoque["cocada"] = estoque["cocada"] - 5', cols:['caju','cocada','suco'], linhas:[['depois da linha 1',['3','5','—'],[1,1,1]],['depois da linha 2',['5','5','—']],['depois da linha 3',['5','5','4']],['depois da linha 4',['5','0','4']]]},
  {t:'codigo', lista:'c11'},
  {t:'quiz', titulo:'Revisão da semana', perguntas:[
    {p:'d = {"a": 1}\nd["a"] = d["a"] + 1\nQuanto vale d["a"]?', ops:['1','2','"a1"','Dá erro'], r:1, exp:'Lê o valor atual (1), soma 1 e guarda de volta.'},
    {p:'Qual a vantagem do dicionário sobre a lista para buscar por nome?', ops:['Nenhuma','Acha o valor direto pela chave, sem olhar item por item','Ocupa menos espaço sempre','Só aceita números'], r:1, exp:'A busca pela chave é direta, mesmo com milhares de itens.'}

  {t:'cena', bg:'escritorio', falas:[

{ id:12, dia:'Semana 3', titulo:'Matrizes', sub:'Parte 2 · Laços dentro de laços para percorrer grades.', bg:'armazem', musica:'trabalho', buzio:{x:78,y:40,frase:'O tecido forte tem fios na vertical e na horizontal.'}, passos:[
  {t:'cena', bg:'armazem', falas:[
    ['nina','O armazém novo, em Feira de Santana, é enorme. O mapa dele é uma grade de linhas e colunas.'],
    ['davi','Em Python, uma grade é uma lista de listas: a matriz. Você acessa com mapa[linha][coluna].'],
    ['teo','Para passar por todas as casas, um laço dentro do outro: o de fora anda nas linhas e o de dentro anda nas colunas.'],
    ['bit','NOVA HABILIDADE: REPITA DENTRO DE REPITA. ESTOU EMOCIONADO.']
  ]},
  {t:'aula', titulo:'Laços aninhados e matrizes', rot:['Python','Em português'], paras:['Uma matriz é uma lista de listas: cada lista interna é uma linha. mapa[1][2] é a linha 1, coluna 2.','Para percorrer todas as casas, usamos um laço dentro do outro: o de fora passa pelas linhas e, para cada linha, o de dentro passa pelas colunas. Se o de fora roda 3 vezes e o de dentro 4, o miolo roda 3 × 4 = 12 vezes.'],
    fatos:[['Matriz','[[1, 2], [3, 4]]'],['Acesso','m[linha][coluna]'],['Total de voltas','linhas × colunas']],
    portugol:'mapa = [\n    [0, 2, 1],\n    [3, 0, 4],\n]\ntotal = 0\nfor linha in mapa:          # cada linha\n    for qtd in linha:       # cada casa da linha\n        total = total + qtd\nprint(total)                # 10\nprint(mapa[1][2])           # 4',
    python:'# Em português:\n# o mapa tem 2 linhas e 3 colunas\n# comece o total em zero\n# para cada linha do mapa:\n#     para cada casa dessa linha:\n#         some a quantidade ao total\n# mostre o total\n# mostre a casa da linha 1, coluna 2',
    real:'Planilhas, imagens (pixels) e tabuleiros de jogos são matrizes. Processar uma imagem é passar por cada pixel com dois laços.'},
  {t:'robo', nivel:'n9'},
  {t:'mesa', titulo:'Teste de mesa: laço dentro de laço', instr:'Complete o total ao fim de cada volta do laço de dentro.', codigo:'total = 0\nfor i in range(1, 3):\n    for j in range(1, 4):\n        total = total + i * j', cols:['i','j','total'], linhas:[['volta 1',['1','1','1'],[1,1,0]],['volta 2',['1','2','3'],[1,1,0]],['volta 3',['1','3','6'],[1,1,0]],['volta 4',['2','1','8'],[1,1,0]],['volta 5',['2','2','12'],[1,1,0]],['volta 6',['2','3','18'],[1,1,0]]]},

  {t:'cena', bg:'armazem', falas:[

{ id:13, dia:'Semana 4', titulo:'Busca e ordenação', sub:'Parte 2 · O algoritmo certo faz o sistema aguentar.', bg:'escritorio', musica:'trabalho', buzio:{x:30,y:24,frase:'Quem procura com método acha antes de quem corre.'}, passos:[
  {t:'cena', bg:'escritorio', falas:[
    ['zuri','Os clientes estão reclamando: o atendimento demora para achar um pedido entre 50 mil.',{musica:'trabalho'}],
    ['davi','O sistema procura um por um, do começo ao fim. É a busca linear. Com 50 mil pedidos, pode levar 50 mil passos.'],
    ['kiara','Se a lista estiver ordenada, dá para usar a busca binária: olha o meio, descarta metade e repete. Com 50 mil itens, uns 16 passos.'],
    ['teo','E para ordenar também existe algoritmo. O mais simples é o da bolha: compara vizinhos e troca quando estão fora de ordem.'],
    ['zuri','Escolher o algoritmo certo é o que separa um sistema que aguenta de um que cai.']
  ]},
  {t:'aula', titulo:'Busca e ordenação', rot:['Python','Em português'], paras:['A busca linear olha item por item: é simples, mas com n itens pode precisar de n passos. A busca binária exige a lista ordenada: olha o meio, descarta a metade que não serve e repete. Com 1.000 itens, bastam uns 10 passos.','Para ordenar, o método da bolha compara vizinhos e troca os que estão fora de ordem; a cada passada, o maior vai para o fim. É fácil de entender, mas lento com muitos dados. No dia a dia, usamos sorted(), que é bem mais rápido.'],
    fatos:[['Linear','até n passos'],['Binária','cerca de log₂(n) passos'],['Bolha','cerca de n² comparações']],
    portugol:'def busca_binaria(lista, alvo):\n    inicio, fim = 0, len(lista) - 1\n    while inicio <= fim:\n        meio = (inicio + fim) // 2\n        if lista[meio] == alvo:\n            return meio\n        elif lista[meio] < alvo:\n            inicio = meio + 1    # descarta a esquerda\n        else:\n            fim = meio - 1       # descarta a direita\n    return -1',
    python:'# Em português:\n# comece olhando a lista inteira\n# enquanto ainda houver um pedaço para olhar:\n#     pegue a posição do meio\n#     se o meio é o alvo, achou: devolva a posição\n#     se o meio é menor que o alvo, o alvo só pode estar à direita\n#     senão, o alvo só pode estar à esquerda\n# se o pedaço acabou, o alvo não está na lista: devolva -1',
    real:'Perguntas de busca e ordenação aparecem em muitas entrevistas técnicas. O mais importante é saber explicar por que escolheu cada algoritmo.'},
  {t:'binaria', titulo:'Ache o pedido', instr:'O sistema pensou num número de pedido entre 1 e 100. A cada chute, ele diz se o número é maior ou menor. Tente achar em até 7 chutes.'},
  {t:'bolha', titulo:'Ordene com o método da bolha', instr:'Compare cada par de vizinhos destacado: se o da esquerda for maior, troque. A cada passada, o maior número vai para o fim.', lista:[5,2,8,1,4]},
  {t:'codigo', lista:'c13'},
  {t:'quiz', titulo:'Revisão da semana', perguntas:[
    {p:'Lista ordenada: [2, 5, 8, 12, 20]\nNa busca binária pelo 12, qual é o primeiro item olhado?', ops:['2','8','12','20'], r:1, exp:'O meio da lista (índice 2) é o 8. Como 8 < 12, a esquerda é descartada.'},
    {p:'Depois da primeira passada da bolha em [5, 2, 8, 1], onde fica o 8?', ops:['No começo','No fim','No meio','Some'], r:1, exp:'A cada passada, o maior borbulha para o fim.'}
  ]},
  {t:'cena', bg:'escritorio', falas:[
    ['davi','Ordenei os registros por horário. Olhem: cada fantasma nasce exatamente 5 segundos depois do pedido original, e depois de novo, e de novo.'],

let passoAtual=null;
function irPasso(ci,si){
  PORT_AVULSO=false;
  S.cap=ci; S.passo=si; salvar(); hud();
  const C=CAPS[ci], p=C.passos[si];
  if(!p){ concluirCap(ci); return; }
  passoAtual=p;
  if(p.bg) setBg(p.bg); else if(!bgAtual) setBg(C.bg);
  AU.humor(p.musica||(p.t==='robo'?null:C.musica)||C.musica);
  mostrarBuzio(p.t==='cena'?C:null);
  const fn={cena:rodarCena,aula:renderAula,ordenar:renderOrdenar,robo:renderRobo,quiz:renderQuiz,classificar:renderClass,mesa:renderMesa,vf:renderVF,prateleira:renderPrat,bug:renderBug,prever:renderPrever,apagao:renderApagao,interrogatorio:renderInterro,final:renderFinal,codigo:renderCodigo,portfolio:renderPortfolio,binaria:renderBinaria,bolha:renderBolha}[p.t];
  fn(p);
}
function proximo(){ AU.efeito('clique'); irPasso(S.cap,S.passo+1); }
function concluirCap(ci){ S.feitos[ci]=true; salvar(); AU.efeito('sucesso'); abrirMapa(ci); }
function iniciarCap(ci){
  AU.init(); fecharModal(); mostrarPainel(false); $('#telas').innerHTML=''; const C=CAPS[ci]; if(ci>=1) PY.iniciar(); setBg(C.bg); AU.humor(C.musica); AU.efeito('capitulo');
  const ini=(ci===S.cap&&!S.feitos[ci]&&S.passo>0&&S.passo<C.passos.length)?S.passo:0;
  $('#hud').hidden=false; S.cap=ci; S.passo=ini; hud();
  const l=document.createElement('div'); l.id='letreiro'; l.innerHTML=`<div class="d">${esc(C.dia)}${ci>0?' · Capítulo '+ci:''}</div><h2>${esc(C.titulo)}</h2><p>${esc(C.sub)}</p>`;
  let foi=false; const vai=()=>{ if(foi) return; foi=true; l.remove(); if(ini===0&&PROVAS[ci]&&!S.feitos[ci]) telaProva(ci); else irPasso(ci,ini); };
  l.onclick=vai; $('#app').appendChild(l); setTimeout(vai,3200);
}

function renderMesa(p){
  let tent=0;
  const corpo=()=>`<div class="olho">Teste de mesa</div><h2>${esc(p.titulo)}</h2><p class="instr">${esc(p.instr)}</p><pre class="cod">${realce(p.codigo.split('\n').map((l,i)=>(String(i+1).padStart(2,' '))+'  '+l).join('\n'))}</pre>
    <div class="mesa-wrap"><table class="mesa"><thead><tr><th></th>${p.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${p.linhas.map(([rot,vals,fixo],r)=>`<tr><td>${esc(rot)}</td>${vals.map((v,c)=>fixo&&fixo[c]?`<td class="fixo">${esc(v)}</td>`:`<td><input id="m${r}_${c}" autocomplete="off" aria-label="${esc(p.cols[c])} ${esc(rot)}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div id="mmsg"></div><div class="acoes"><button class="btn sec" id="mresp" hidden>Mostrar resposta</button><button class="btn" id="mok">Conferir</button></div>`;
  card('teste-de-mesa',corpo());
  const norm=s=>String(s).trim().replace(',','.').replace(/^−/,'-').replace(/^-$/,'—');
  $('#mok').onclick=()=>{ let erros=0, vazios=0; p.linhas.forEach(([,vals,fixo],r)=>vals.forEach((v,c)=>{ if(fixo&&fixo[c]) return; const el=$(`#m${r}_${c}`); const val=norm(el.value); if(!val){ vazios++; el.className=''; return; } const ok=val===norm(v); el.className=ok?'ok':'er'; if(!ok) erros++; }));
    if(vazios){ $('#mmsg').innerHTML=`<div class="msg info">Faltam ${vazios} campo${vazios>1?'s':''} para preencher.</div>`; return; }
    if(erros){ tent++; AU.efeito('erro'); $('#mmsg').innerHTML=`<div class="msg erro">${erros} valor${erros>1?'es':''} não bate${erros>1?'m':''}. Volte na primeira linha vermelha e refaça a conta a partir dali: um erro costuma arrastar os outros.</div>`; if(tent>=2) $('#mresp').hidden=false; return; }
    AU.efeito('sucesso'); FX.confete(70); $('#mmsg').innerHTML=`<div class="msg ok">Tabela perfeita! Teste de mesa é a ferramenta número 1 para entender código.</div>`; const b=$('#mok'); b.textContent='Continuar ▸'; b.onclick=proximo; $('#mresp').hidden=true; };
  $('#mresp').onclick=()=>{ p.linhas.forEach(([,vals,fixo],r)=>vals.forEach((v,c)=>{ if(fixo&&fixo[c]) return; const el=$(`#m${r}_${c}`); el.value=v; el.className='ok'; })); $('#mmsg').innerHTML='<div class="msg info">Confira linha por linha como cada valor foi calculado e depois continue.</div>'; const b=$('#mok'); b.textContent='Continuar ▸'; b.onclick=proximo; };
}

function renderVF(p){
  const st={i:0,ac:0,tm:null,resp:false};
  const draw=()=>{
    clearTimeout(st.tm);
    if(st.i>=p.itens.length){ const ok=st.ac>=p.minimo; AU.efeito(ok?'sucesso':'erro'); if(ok) FX.confete(70);
      card('verdadeiro-ou-falso',`<div class="olho">Resultado</div><h2>${st.ac} de ${p.itens.length}</h2><p>${ok?'Mandou bem! Seu cérebro já avalia expressões como um computador.':`Você precisa de ${p.minimo} acertos. Respire, releia a aula e tente de novo.`}</p><div class="acoes"><button class="btn sec" onclick="irPasso(S.cap,S.passo)">Jogar de novo</button>${ok?'<button class="btn" onclick="proximo()">Continuar ▸</button>':''}</div>`); return; }
    const [ex]=p.itens[st.i]; st.resp=false;
    card('verdadeiro-ou-falso',`<div class="olho">Rodada ${st.i+1} de ${p.itens.length} · acertos: ${st.ac}</div><h2>${esc(p.titulo)}</h2>
      <div class="vf-vars">${Object.entries(p.vars).map(([k,v])=>`<span>${k} = ${v}</span>`).join('')}</div>
      <div class="vf-tempo"><div id="vft"></div></div><div class="vf-expr">${realce(ex)}</div>
      <div class="vf-btns"><button class="vf-v" onclick="vfResp(true)">VERDADEIRO</button><button class="vf-f" onclick="vfResp(false)">FALSO</button></div><div id="vfmsg"></div>`);
    const bar=$('#vft'); bar.style.transition='none'; bar.style.transform='scaleX(1)'; requestAnimationFrame(()=>requestAnimationFrame(()=>{ bar.style.transition='transform 8s linear'; bar.style.transform='scaleX(0)'; }));
    st.tm=setTimeout(()=>{ if(passoAtual===meu) vfResp(null); },8000);
  };
  const meu=passoAtual;
  window.vfResp=(v)=>{ if(st.resp||passoAtual!==meu||!$('#vfmsg')) return; st.resp=true; clearTimeout(st.tm); const [ex,cer]=p.itens[st.i]; const ok=v===cer; if(ok) st.ac++; AU.efeito(ok?'estrela':'erro');
    const bar=$('#vft'); if(bar){ const cs=getComputedStyle(bar).transform; bar.style.transition='none'; bar.style.transform=cs; }
    $('#vfmsg').innerHTML=`<div class="msg ${ok?'ok':'erro'}">${v===null?'Tempo esgotado! ':ok?'Certo! ':'Errou. '}A expressão é ${cer?'VERDADEIRA':'FALSA'}.</div>`;
    setTimeout(()=>{ if(passoAtual!==meu) return; st.i++; draw(); },1500); };
  draw();
}

function renderPrat(p){
  const st={i:0,resp:null}; const nome=p.nome||'produtos';
  const draw=()=>{
    if(st.i>=p.rodadas.length){ AU.efeito('sucesso'); FX.confete(70); card('prateleira',`<div class="olho">Desafio concluído</div><h2>${esc(p.fimTitulo||'Você domina os índices')}</h2><p>${esc(p.fimTexto||'Portugol começa em 1, Python começa em 0, e em Python o -1 é sempre o último item.')}</p><div class="acoes"><span></span><button class="btn" onclick="proximo()">Continuar ▸</button></div>`); return; }
    const [modo,expr,ans]=p.rodadas[st.i]; const py=modo==='py';
    const valor = p.texto ? `${nome} = "${p.itens.join('')}"` : (py?`${nome} = [`+p.itens.map(x=>'"'+x+'"').join(', ')+']':`${nome} <- [`+p.itens.map(x=>'"'+x+'"').join(', ')+']');
    card('prateleira',`<div class="olho">Rodada ${st.i+1} de ${p.rodadas.length}</div><h2>${esc(p.titulo)}</h2>
      <pre class="cod">${realce(valor)}</pre>
      <p style="font-size:18px">Em <span class="modo ${py?'py':'pt'}">${py?'Python':'Portugol'}</span>, qual ${p.texto?'caractere':'caixa'} é <code style="font-family:var(--f-mono);color:#7fdbff;font-size:20px">${esc(expr)}</code>?</p>
      <div class="prat">${p.itens.map((it,k)=>`<button data-k="${k}" class="${st.resp!==null?(k===ans?'ok':k===st.resp?'er':''):''}" ${p.texto?'style="width:52px"':''}><div class="cx" ${p.texto?'style="width:48px"':''}><span>${esc(it)}</span></div><div class="ix">${st.resp!==null?(py?`[${k}]`:`[${k+1}]`):''}</div></button>`).join('')}</div>
      <div id="pmsg"></div>`);
    if(st.resp!==null){ const ok=st.resp===ans; $('#pmsg').innerHTML=`<div class="msg ${ok?'ok':'erro'}">${ok?'Isso!':'Não era esse.'} ${py?(expr.includes('-')?'Índices negativos contam a partir do fim: -1 é o último.':'Em Python o primeiro índice é 0.'):'No Portugol o primeiro índice é 1.'}</div><div class="acoes"><span></span><button class="btn" id="pnext">Próxima ▸</button></div>`; $('#pnext').onclick=()=>{ st.i++; st.resp=null; draw(); }; }
    else document.querySelectorAll('.prat button').forEach(b=>b.onclick=()=>{ st.resp=Number(b.dataset.k); AU.efeito(st.resp===ans?'estrela':'erro'); draw(); });
  };
  draw();
}

    <div class="linhas">${B.cod.map((l,i)=>`<button data-i="${i}" class="${st.achou&&i===B.bug?'ok':st.erradas.has(i)?'er':''}"><span class="ln">${i+1}</span>${realce(l)}</button>`).join('')}</div><div id="bmsg">${msg}</div>`);
    if(!st.achou) document.querySelectorAll('.linhas button').forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.i); if(i===B.bug){ st.achou=true; AU.efeito('estrela'); draw(`<div class="msg ok">${esc(B.achou)}</div>`); fix(); } else { st.erradas.add(i); AU.efeito('erro'); draw(`<div class="msg erro">${esc(B.porque[i])}</div>`); } }); };

    m.querySelectorAll('.op').forEach(b=>b.onclick=()=>{ const k=Number(b.dataset.k); if(k===0){ b.classList.add('ok'); m.querySelectorAll('.op').forEach(x=>x.disabled=true); AU.efeito('sucesso'); FX.confete(80); $('#bfix').innerHTML=`<div class="msg ok">${esc(B.corrigido)}</div><div class="acoes"><span></span><button class="btn" onclick="proximo()">Continuar ▸</button></div>`; } else { b.classList.add('er'); AU.efeito('erro'); $('#bfix').innerHTML=`<div class="msg erro">${esc(B.exps[k])}</div>`; } }); };
  draw();

/* busca binária: adivinhar o número do pedido */
function renderBinaria(p){
  const alvo=1+Math.floor(Math.random()*100); const st={lo:1,hi:100,tent:[],fim:false};
  const caminhoBit=()=>{ let lo=1,hi=100,l=[]; while(lo<=hi){ const m=Math.floor((lo+hi)/2); l.push(m); if(m===alvo) break; if(m<alvo) lo=m+1; else hi=m-1; } return l; };
  const draw=(msg='')=>{ const bit=st.fim?caminhoBit():[];
    card('busca-binaria',`<div class="olho">Desafio de busca</div><h2>${esc(p.titulo)}</h2><p class="instr">${esc(p.instr)}</p>
      <div style="position:relative;height:30px;background:#15113f;border:1px solid #34307a;border-radius:10px;margin:14px 0 6px;overflow:hidden"><div style="position:absolute;top:0;bottom:0;left:${st.lo-1}%;width:${Math.max(1,st.hi-st.lo+1)}%;background:linear-gradient(90deg,rgba(46,196,182,.35),rgba(245,185,66,.35));transition:all .4s"></div>${st.tent.map(g=>`<div style="position:absolute;top:0;bottom:0;left:${g-1}%;width:2px;background:${g===alvo?'#4ade80':'#ff6b6b'}"></div>`).join('')}</div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--nevoa)"><span>1</span><span>50</span><span>100</span></div>
      <p>O pedido está entre <b>${st.lo}</b> e <b>${st.hi}</b> · tentativas: <b>${st.tent.length}</b></p>
      ${st.fim?`<div class="msg ok"><b>Achou o pedido ${alvo} em ${st.tent.length} tentativa${st.tent.length>1?'s':''}!</b> ${st.tent.length<=7?'Você pensou como a busca binária.':'Dá para fazer em no máximo 7: chute sempre no meio da faixa.'}</div>
        <div class="real"><b>O Bit, usando busca binária:</b> ${bit.join(' → ')} (${bit.length} passos). Chutando sempre no meio, cada tentativa descarta metade da faixa. Com 100 números, nunca passa de 7. Com 1 milhão, nunca passa de 20.</div>
        <div class="acoes"><button class="btn sec" onclick="renderBinaria(passoAtual)">Jogar de novo</button><button class="btn" onclick="proximo()">Continuar ▸</button></div>`
      :`<div style="display:flex;gap:10px;flex-wrap:wrap"><input class="campo" id="bnin" inputmode="numeric" placeholder="Seu chute (1 a 100)" autocomplete="off"><button class="btn" id="bnok">Chutar</button></div>`}
      <div id="bnmsg">${msg}</div>`);
    if(!st.fim){ const ch=()=>{ const g=parseInt($('#bnin').value,10); if(!(g>=1&&g<=100)){ $('#bnmsg').innerHTML='<div class="msg info">Digite um número de 1 a 100.</div>'; return; } st.tent.push(g);
        if(g===alvo){ st.fim=true; AU.efeito('sucesso'); FX.confete(80); draw(); return; }
        if(g<alvo){ st.lo=Math.max(st.lo,g+1); AU.efeito('virar'); draw(`<div class="msg info">O número do pedido é <b>MAIOR</b> que ${g}.</div>`); } else { st.hi=Math.min(st.hi,g-1); AU.efeito('virar'); draw(`<div class="msg info">O número do pedido é <b>MENOR</b> que ${g}.</div>`); }
        const i=$('#bnin'); if(i) i.focus(); };
      $('#bnok').onclick=ch; $('#bnin').onkeydown=e=>{ if(e.key==='Enter') ch(); }; }
  };
  draw();
}

/* método da bolha passo a passo */
function renderBolha(p){
  const arr=p.lista.slice(); const st={i:0,j:0,trocou:false,comp:0,fim:false};
  const draw=(msg='')=>{ const n=arr.length;
    card('ordenacao-bolha',`<div class="olho">Ordenação</div><h2>${esc(p.titulo)}</h2><p class="instr">${esc(p.instr)}</p>
      <div style="display:flex;gap:10px;justify-content:center;margin:20px 0;flex-wrap:wrap">${arr.map((v,k)=>{ const par=!st.fim&&(k===st.j||k===st.j+1); const pronto=st.fim||k>=n-st.i; return `<div style="width:58px;height:${40+v*9}px;align-self:flex-end;border-radius:10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-weight:800;font-family:var(--f-mono);font-size:18px;transition:all .3s;background:${pronto?'rgba(74,222,128,.35)':par?'rgba(245,185,66,.5)':'#2a2370'};border:2px solid ${par?'var(--ouro)':pronto?'var(--ok)':'#4a43a8'}">${v}</div>`; }).join('')}</div>
      <p style="text-align:center;color:var(--nevoa)">Passada ${Math.min(st.i+1,n-1)} · comparações: ${st.comp}</p>
      ${st.fim?`<div class="msg ok"><b>Lista ordenada com ${st.comp} comparações!</b> A cada passada, o maior número "borbulha" para o fim. Com 5 números são até 10 comparações; com 1.000, perto de 500 mil. Por isso, com muitos dados, usamos algoritmos mais rápidos, como o sorted() do Python.</div><div class="acoes"><span></span><button class="btn" onclick="proximo()">Continuar ▸</button></div>`
      :`<p style="font-size:18px;text-align:center">${arr[st.j]} e ${arr[st.j+1]}: trocar de lugar ou manter?</p><div class="vf-btns"><button class="vf-v" id="bmant" style="background:#2a2370;box-shadow:0 5px 0 #13104a">Manter</button><button class="vf-f" id="btroc" style="background:#d9822b;box-shadow:0 5px 0 #8a4f12">Trocar</button></div>`}
      <div id="bomsg">${msg}</div>`);
    if(st.fim) return;
    const resp=troca=>{ const a=arr[st.j],b=arr[st.j+1]; const certo=(a>b)===troca;
      if(!certo){ AU.efeito('erro'); draw(`<div class="msg erro">${troca?`${a} já é menor que ${b}: estão na ordem certa, mantenha.`:`${a} é maior que ${b}: o maior precisa ir para a direita. Troque.`}</div>`); return; }
      st.comp++; if(troca){ arr[st.j]=b; arr[st.j+1]=a; st.trocou=true; AU.efeito('bloco'); } else AU.efeito('clique');
      st.j++; let m='';
      if(st.j>=arr.length-1-st.i){ if(!st.trocou||st.i>=arr.length-2){ st.fim=true; AU.efeito('sucesso'); FX.confete(80); } else { m=`<div class="msg info">Fim da passada ${st.i+1}: o ${arr[arr.length-1-st.i]} chegou ao lugar dele. Recomeçando do início.</div>`; st.i++; st.j=0; st.trocou=false; } }
      draw(m); };
    $('#bmant').onclick=()=>resp(false); $('#btroc').onclick=()=>resp(true);
  };
  draw();
}

function renderPrever(p){
  const st={i:0};
  const draw=()=>{ if(st.i>=p.perguntas.length){ AU.efeito('sucesso'); FX.confete(60); card('prever',`<div class="olho">Função dominada</div><h2>Frete calculado</h2><p>Você executou a função de cabeça, incluindo a fronteira. É exatamente isso que um entrevistador quer ver.</p><div class="acoes"><span></span><button class="btn" onclick="proximo()">Continuar ▸</button></div>`); return; }
    const [ch,resp,exp]=p.perguntas[st.i];
    card('prever',`<div class="olho">Pergunta ${st.i+1} de ${p.perguntas.length}</div><h2>${esc(p.titulo)}</h2><p class="instr">${esc(p.instr)}</p><pre class="cod">${realce(p.codigo)}</pre>
      <p style="font-size:18px">Quanto retorna <code style="font-family:var(--f-mono);color:#7fdbff">${esc(ch)}</code>?</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><input class="campo" id="pin" inputmode="decimal" placeholder="Digite o número" autocomplete="off"><button class="btn" id="pok">Conferir</button></div><div id="pvm"></div>`);
    const conf=()=>{ const v=$('#pin').value.trim().replace(',','.'); if(!v) return; if(Number(v)===Number(resp)){ AU.efeito('estrela'); $('#pvm').innerHTML=`<div class="msg ok">Certo! ${esc(exp)}</div><div class="acoes"><span></span><button class="btn" id="pnx">Próxima ▸</button></div>`; $('#pnx').onclick=()=>{ st.i++; draw(); }; } else { AU.efeito('erro'); $('#pvm').innerHTML=`<div class="msg erro">Não é ${esc(v)}. Primeiro veja se o peso entra no "se" ou no "senão", depois faça a conta.</div>`; } };
    $('#pok').onclick=conf; $('#pin').onkeydown=e=>{ if(e.key==='Enter') conf(); }; };
  draw();
}

  const ov=document.createElement('div'); ov.className='tela-cheia'; ov.style.cssText='z-index:42;background:radial-gradient(circle 120px at var(--x,50%) var(--y,50%),rgba(255,240,200,.05),rgba(0,0,0,.97) 70%);cursor:none';

    <button id="disj" aria-label="Quadro de luz" style="position:absolute;left:${px}%;top:${py}%;transform:translate(-50%,-50%);width:70px;height:90px;border-radius:8px;background:#3b3f55;border:3px solid #6b7090;cursor:none;opacity:.9"><span style="display:block;width:16px;height:30px;margin:0 auto;background:#ff6b5a;border-radius:4px"></span></button>
    <div id="dica-ap" style="position:absolute;bottom:40px;left:50%;transform:translateX(-50%);color:#b9b2dc;font-size:14px;pointer-events:none"></div>`;
