<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Código Baobá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Mundo único: noite em Salvador, anil profundo com ouro de dendê e neon do mar */
  --noite:#0e0b26; --anil:#1d1854; --anil2:#2a2370; --ouro:#f5b942; --coral:#ff6b5a; --mar:#2ec4b6;
  --areia:#fff4e0; --nevoa:#b9b2dc; --ok:#4ade80; --erro:#ff6b6b;
  --f-disp:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --f-corpo:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--noite);color:var(--areia);font-family:var(--f-corpo);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
code,pre,textarea,.simbolos button,.testes,.console,.vf-expr,.linhas,.prog,.mesa th,.mesa input,.vf-vars span,.barra{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
button:focus-visible,input:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden}

/* ---------- palco ---------- */
#palco{position:absolute;inset:0;overflow:hidden}
#cena{position:absolute;inset:0;transition:filter .5s}
#cena svg{width:100%;height:100%;display:block}
#cena .camada{position:absolute;inset:0;transition:opacity .8s}
#palco.escuro #cena,#palco.escuro #bustos,#palco.escuro #fx{filter:brightness(.38) saturate(.7) blur(2px)}
#fx,#confete{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#confete{z-index:60}
#bustos{position:absolute;inset:0;pointer-events:none;transition:filter .5s}
.busto{position:absolute;bottom:0;height:min(68%,560px);aspect-ratio:200/260;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .45s,filter .35s;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
.busto svg{width:100%;height:100%}
.busto.l{left:4%}.busto.r{right:4%}
.busto.fora.l{transform:translateX(-60%);opacity:0}.busto.fora.r{transform:translateX(60%);opacity:0}
.busto.quieto{filter:brightness(.5) saturate(.7) drop-shadow(0 10px 30px rgba(0,0,0,.5))}
.busto.fala{animation:respira 2.6s ease-in-out infinite}
.busto.bit{height:min(50%,400px)}
@keyframes respira{0%,100%{translate:0 0}50%{translate:0 -6px}}
.ret .ba{opacity:0}
.falando .ret .ba{animation:boca .17s infinite alternate}
.falando .ret .bf{animation:boca .17s infinite alternate-reverse}
.falando .ret .bm{animation:bocabit .15s infinite alternate}
@keyframes boca{from{opacity:0}to{opacity:1}}
@keyframes bocabit{from{transform:scaleX(.4)}to{transform:scaleX(1.1)}}
.ret .bm{transform-box:fill-box;transform-origin:center}
.ret .palp{transform-box:fill-box;transform-origin:top;transform:scaleY(0);animation:pisca 4.8s infinite}
.ret .olhobit{transform-box:fill-box;transform-origin:center;animation:piscabit 4.2s infinite}
@keyframes pisca{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes piscabit{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ret .antena{animation:antena 1.4s infinite}
@keyframes antena{0%,100%{opacity:1}50%{opacity:.3}}

/* elementos animados das cenas */
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.jan{animation:jan 7s steps(1) infinite}
@keyframes jan{0%,100%{opacity:1}40%{opacity:.35}70%{opacity:1}}
.led{animation:led 1.1s steps(1) infinite}
@keyframes led{0%,100%{opacity:1}50%{opacity:.15}}
.tela{animation:tela 4s ease-in-out infinite}
@keyframes tela{0%,100%{opacity:.85}50%{opacity:1}}
.farol{transform-origin:1380px 330px;animation:farol 6s linear infinite}
@keyframes farol{from{transform:rotate(-35deg)}50%{transform:rotate(35deg)}to{transform:rotate(-35deg)}}
.esteira{animation:esteira 9s linear infinite}
@keyframes esteira{from{transform:translateX(-260px)}to{transform:translateX(1700px)}}
.neon{animation:neon 5s infinite}
@keyframes neon{0%,18%,22%,100%{opacity:1}20%{opacity:.4}}
.flutua{animation:flutuar 6s ease-in-out infinite}
@keyframes flutuar{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* efeitos */
.tremer{animation:tremer .5s}
@keyframes tremer{0%,100%{transform:none}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
#flash.on{animation:flash .6s}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
#alarme{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,40,60,.55));transition:opacity .4s}
#alarme.on{opacity:1;animation:alarme 1s infinite}
@keyframes alarme{0%,100%{opacity:.25}50%{opacity:1}}
.glitch{position:relative;animation:glitch .35s infinite;text-shadow:2px 0 var(--coral),-2px 0 var(--mar)}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px);opacity:.8}75%{transform:translate(-1px,0)}100%{transform:translate(0)}}
#palco.glitchado #cena{animation:glitchcena .25s 6}
@keyframes glitchcena{0%{filter:hue-rotate(0)}50%{filter:hue-rotate(90deg) contrast(1.6);transform:translateX(6px)}100%{filter:none}}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:linear-gradient(rgba(10,8,30,.85),transparent);pointer-events:none}
#hud>*{pointer-events:auto}
#hud[hidden]{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(14,11,38,.78);border:1px solid rgba(245,185,66,.35);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip svg{width:18px;height:18px}
#hudcap{font-family:var(--f-disp);font-size:15px;max-width:45vw;overflow:hidden;text-overflow:ellipsis}
.hudbtns{display:flex;gap:6px;align-items:center}
.ico{width:38px;height:38px;border-radius:12px;background:rgba(14,11,38,.78);border:1px solid rgba(185,178,220,.3);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ico:hover{border-color:var(--ouro)}
.ico svg{width:20px;height:20px}

/* ---------- diálogo ---------- */
#dialogo{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;width:min(920px,calc(100% - 24px));z-index:20;cursor:pointer}
#dialogo[hidden]{display:none}
.caixa{position:relative;background:linear-gradient(180deg,rgba(29,24,84,.96),rgba(14,11,38,.97));border:2px solid rgba(245,185,66,.55);border-radius:20px;padding:26px 22px 18px;min-height:132px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.nome{position:absolute;top:-17px;left:22px;font-family:var(--f-disp);font-weight:800;font-size:17px;padding:2px 16px;border-radius:999px;color:#160f2e;letter-spacing:.3px}
.nome[hidden]{display:none}
#txt{font-size:clamp(16px,2.2vw,19px);line-height:1.55;margin:0;min-height:58px;max-width:70ch}
#txt.narra{font-style:italic;color:#ffe2a8}
.seta{position:absolute;right:18px;bottom:12px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid var(--ouro);animation:quica 1s infinite;opacity:0}
.seta.on{opacity:1}
@keyframes quica{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.escolhas{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.escolhas button{background:var(--anil2);border:2px solid var(--mar);border-radius:14px;padding:10px 16px;font-size:16px;font-weight:700;cursor:pointer;text-align:left}
.escolhas button:hover{background:#34308a}
#pular{position:absolute;right:14px;top:-15px;background:rgba(14,11,38,.9);border:1px solid rgba(185,178,220,.4);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer;color:var(--nevoa)}

/* ---------- painel de atividades ---------- */
#painel{position:absolute;inset:62px 0 0 0;z-index:25;overflow-y:auto;padding:4px 14px 28px;display:none}
#painel.on{display:block}
.card{width:min(860px,100%);margin:0 auto;background:linear-gradient(180deg,rgba(29,24,84,.97),rgba(16,13,46,.98));border:1px solid rgba(46,196,182,.45);border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden;animation:sobe .45s cubic-bezier(.2,.8,.2,1)}
@keyframes sobe{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.barra{display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(46,196,182,.12);border-bottom:1px solid rgba(46,196,182,.3);font-family:var(--f-mono);font-size:12px;color:var(--mar)}
.barra i{width:10px;height:10px;border-radius:50%;display:inline-block}
.barra .tit{margin-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.corpo{padding:20px 20px 24px}
.corpo h2{font-family:var(--f-disp);font-size:clamp(22px,3.4vw,30px);line-height:1.15;margin:0 0 6px;text-wrap:balance}
.corpo h3{font-family:var(--f-disp);font-size:18px;color:var(--ouro);margin:18px 0 6px}
.corpo p{margin:8px 0;line-height:1.6;max-width:68ch}
.olho{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--mar)}
.instr{color:var(--nevoa)}
pre.cod{background:#090720;border:1px solid #2c2768;border-radius:14px;padding:14px 16px;overflow-x:auto;font-family:var(--f-mono);font-size:14px;line-height:1.65;margin:12px 0;color:#d9d4ff}
.k{color:#ff8fb1;font-weight:600}.s{color:#9be37a}.n{color:#ffb86b}.c{color:#7d76b3;font-style:italic}.o{color:#7fdbff}
.abas{display:flex;gap:6px;margin-top:12px}
.abas button{background:transparent;border:1px solid #3a3480;border-radius:10px 10px 0 0;padding:6px 14px;font-weight:700;cursor:pointer;color:var(--nevoa);font-size:14px}
.abas button.on{background:#090720;color:var(--areia);border-color:#2c2768}
.abas+pre.cod{margin-top:0;border-top-left-radius:0}
.fatos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0}
.fato{background:rgba(245,185,66,.08);border:1px solid rgba(245,185,66,.3);border-radius:14px;padding:12px}
.fato b{display:block;font-family:var(--f-disp);color:var(--ouro);font-size:17px}
.fato span{font-size:14px;color:var(--nevoa)}
.real{background:rgba(46,196,182,.1);border-left:4px solid var(--mar);border-radius:10px;padding:10px 14px;margin:14px 0;font-size:15px}
.acoes{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{background:linear-gradient(180deg,#ffcb5c,#f0a92f);color:#1d1240;border:0;border-radius:14px;padding:12px 22px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 4px 0 #b8781a;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b8781a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:var(--anil2);color:var(--areia);box-shadow:0 4px 0 #13104a;border:1px solid #4a43a8}
.btn.mini{padding:8px 14px;font-size:14px}
.msg{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px;line-height:1.5}
.msg.ok{background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.45);color:#c9f7d8}
.msg.erro{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.45);color:#ffd4d4}
.msg.info{background:rgba(185,178,220,.1);border:1px solid rgba(185,178,220,.3)}
.sacode{animation:tremer .45s}

/* quiz */
.pontos{display:flex;gap:6px;margin:6px 0 14px}
.pontos i{width:26px;height:6px;border-radius:4px;background:#3a3480}
.pontos i.at{background:var(--ouro)}.pontos i.ok{background:var(--ok)}.pontos i.er{background:var(--erro)}
.pergunta{font-size:18px;font-weight:700;line-height:1.5;margin:10px 0 14px;white-space:pre-line}
.op{display:block;width:100%;text-align:left;background:#15113f;border:2px solid #34307a;border-radius:14px;padding:13px 16px;margin:8px 0;font-size:16px;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not(:disabled){border-color:var(--mar);transform:translateX(3px)}
.op:disabled{cursor:default}
.op.ok{border-color:var(--ok);background:rgba(74,222,128,.13)}
.op.er{border-color:var(--erro);background:rgba(255,107,107,.13)}
.op code,.pergunta code{font-family:var(--f-mono);font-size:.92em;color:#7fdbff}

/* ordenar / classificar */
.pecas{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.peca{background:#15113f;border:2px solid #4a43a8;border-radius:12px;padding:10px 14px;font-size:15px;cursor:pointer;font-weight:600}
.peca:hover{border-color:var(--ouro)}
.peca.sel{border-color:var(--ouro);background:#2a2370;transform:translateY(-3px)}
.peca code{font-family:var(--f-mono)}
.lista-ord{list-style:none;padding:0;margin:10px 0;counter-reset:n}
.lista-ord li{counter-increment:n;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.35);border-radius:12px;padding:10px 14px;margin:6px 0;animation:sobe .3s}
.lista-ord li::before{content:counter(n);display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#0e2a18;font-weight:800;align-items:center;justify-content:center;margin-right:10px;font-size:13px}
.caixas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.caixa-tipo{min-height:110px;border:2px dashed #4a43a8;border-radius:16px;padding:10px;cursor:pointer;background:rgba(21,17,63,.6);transition:border-color .2s}
.caixa-tipo:hover{border-color:var(--mar)}
.caixa-tipo h4{margin:0 0 8px;font-family:var(--f-disp);font-size:17px}
.caixa-tipo .dentro{display:flex;flex-wrap:wrap;gap:6px}
.caixa-tipo .dentro span{font-family:var(--f-mono);font-size:13px;background:rgba(74,222,128,.15);border:1px solid rgba(74,222,128,.4);border-radius:8px;padding:3px 8px;animation:sobe .3s}

/* teste de mesa */
.mesa{width:100%;border-collapse:collapse;margin:12px 0;font-variant-numeric:tabular-nums}
.mesa-wrap{overflow-x:auto}
.mesa th,.mesa td{border:1px solid #34307a;padding:8px;text-align:center;font-size:15px}
.mesa th{background:#1b1650;font-family:var(--f-mono);color:var(--mar)}
.mesa td:first-child{text-align:left;color:var(--nevoa);font-size:14px;white-space:nowrap}
.mesa input{width:72px;background:#090720;border:2px solid #34307a;border-radius:8px;color:var(--areia);padding:6px;text-align:center;font-family:var(--f-mono);font-size:15px}
.mesa input.ok{border-color:var(--ok)}.mesa input.er{border-color:var(--erro)}
.mesa .fixo{font-family:var(--f-mono);color:#d9d4ff}
input.campo{width:100%;max-width:340px;background:#090720;border:2px solid #34307a;border-radius:12px;color:var(--areia);padding:12px 14px;font-size:17px;font-family:var(--f-corpo)}

/* código clicável (bug) */
.linhas{background:#090720;border:1px solid #2c2768;border-radius:14px;padding:8px 0;font-family:var(--f-mono);font-size:14px;overflow-x:auto}
.linhas button{display:flex;width:100%;gap:14px;background:transparent;border:0;border-left:4px solid transparent;padding:6px 14px;text-align:left;cursor:pointer;color:#d9d4ff;font-family:var(--f-mono);font-size:14px;white-space:pre}
.linhas button:hover{background:rgba(46,196,182,.08)}
.linhas button .ln{color:#5d5799;min-width:18px;text-align:right}
.linhas button.ok{border-left-color:var(--ok);background:rgba(74,222,128,.1)}
.linhas button.er{border-left-color:var(--erro);background:rgba(255,107,107,.1)}

/* V ou F */
.vf-vars{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.vf-vars span{font-family:var(--f-mono);background:#090720;border:1px solid #34307a;border-radius:10px;padding:6px 12px}
.vf-expr{font-family:var(--f-mono);font-size:clamp(22px,5vw,34px);text-align:center;padding:26px 10px;background:#090720;border-radius:18px;border:2px solid #34307a;margin:12px 0;color:#7fdbff}
.vf-tempo{height:8px;background:#2a2370;border-radius:6px;overflow:hidden}
.vf-tempo div{height:100%;background:linear-gradient(90deg,var(--coral),var(--ouro));transform-origin:left}
.vf-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.vf-btns button{padding:18px;border-radius:16px;font-size:18px;font-weight:800;cursor:pointer;border:0}
.vf-v{background:#1f8f5a;box-shadow:0 5px 0 #11603a}.vf-f{background:#b8364a;box-shadow:0 5px 0 #7c1e2f}

/* prateleira */
.prat{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 8px;padding:14px 10px 4px;background:linear-gradient(transparent 82%,#5b3f9e 82%,#3b2a70);border-radius:12px}
.prat button{width:92px;cursor:pointer;background:transparent;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s}
.prat button:hover{transform:translateY(-6px)}
.prat .cx{width:84px;height:70px;border-radius:8px;background:linear-gradient(180deg,#d9a46a,#b98149);border:2px solid #8a5a2c;display:flex;align-items:center;justify-content:center;font-weight:800;color:#3b2410;font-size:14px;position:relative}
.prat .cx::before{content:"";position:absolute;top:0;left:50%;width:14px;height:100%;background:rgba(255,236,190,.4);transform:translateX(-50%)}
.prat .cx span{position:relative;z-index:1}
.prat .ix{font-family:var(--f-mono);font-size:13px;color:var(--ouro);min-height:18px}
.prat button.ok .cx{outline:3px solid var(--ok)}.prat button.er .cx{outline:3px solid var(--erro)}
.modo{display:inline-block;font-weight:800;font-size:13px;border-radius:8px;padding:3px 10px}
.modo.py{background:#3776ab;color:#fff}.modo.pt{background:var(--ouro);color:#1d1240}

/* interrogatório */
.suspeitos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.suspeito{background:#15113f;border:2px solid #34307a;border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}
.suspeito .mini{width:64px;height:84px;flex:none}
.suspeito .mini svg{width:100%;height:100%}
.suspeito q{font-style:italic;font-size:16px}

/* ---------- robô ---------- */
.robo{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:18px;align-items:start}
@media (max-width:760px){.robo{grid-template-columns:1fr}}
.robo-info{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
.tag{font-size:13px;font-weight:800;border-radius:999px;padding:4px 12px;background:#2a2370;border:1px solid #4a43a8}
.tag.lim{border-color:var(--ouro);color:var(--ouro)}
.tag.tempo{background:#5a1020;border-color:var(--coral);color:#ffd4d4;font-variant-numeric:tabular-nums;animation:alarme 1s infinite}
.grade-wrap{position:relative;margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2px #34307a,0 16px 40px rgba(0,0,0,.5);background:#141033}
.grade{display:grid}
.cel{position:relative;background:#262051;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.cel.p{background:#211b4d;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.cel.p::before{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(245,185,66,.25)}
.cel.w{background:linear-gradient(180deg,#5b3f9e 0 12%,#3b2a70 12% 50%,#5b3f9e 50% 62%,#3b2a70 62%);box-shadow:inset 0 0 0 2px #2a1d55}
.cel.w::after{content:"";position:absolute;left:18%;right:18%;top:20%;height:24%;background:#c8955a;border-radius:3px;opacity:.85}
.cel.d{background:repeating-linear-gradient(45deg,#f5b942 0 8px,#1b1640 8px 16px)}
.cel.d::after{content:"DOCA";position:absolute;inset:22% 10%;background:#1b1640;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--ouro);letter-spacing:1px}

<script type="text/plain" id="pyworker">const HARNESS = `
import sys, io, json, traceback

def _sem_input(*a, **k):
    raise RuntimeError("Neste curso não usamos input(): os testes já definem os valores.")

def _norm(x):
    if isinstance(x, tuple):
        return [_norm(i) for i in x]
    if isinstance(x, list):
        return [_norm(i) for i in x]
    return x

def _igual(obt, esp):
    obt = _norm(obt)
    if isinstance(esp, bool) or isinstance(obt, bool):
        return isinstance(obt, bool) and isinstance(esp, bool) and obt == esp
    if isinstance(esp, (int, float)) and isinstance(obt, (int, float)):
        return abs(obt - esp) < 1e-6
    if isinstance(esp, list) and isinstance(obt, list):
        return len(esp) == len(obt) and all(_igual(a, b) for a, b in zip(obt, esp))
    return obt == esp

def _rodar(codigo, vars_):
    ns = {'__name__': '__main__', 'input': _sem_input}
    ns.update(vars_)
    buf = io.StringIO()
    velho = sys.stdout
    sys.stdout = buf
    erro = None
    try:
        exec(compile(codigo, 'main.py', 'exec'), ns)
    except SyntaxError as e:
        erro = {'tipo': type(e).__name__, 'msg': str(e.msg), 'linha': e.lineno}
    except BaseException as e:
        linha = None
        for fr in traceback.extract_tb(e.__traceback__):
            if fr.filename == 'main.py':
                linha = fr.lineno
        erro = {'tipo': type(e).__name__, 'msg': str(e), 'linha': linha}
    finally:
        sys.stdout = velho
    return ns, buf.getvalue(), erro

def _linhas(t):
    return '\\n'.join(l.rstrip() for l in t.strip().splitlines())

def _executar(codigo, testes_json, modo):
    testes = json.loads(testes_json)
    if modo == 'rodar':
        v = testes[0].get('vars', {}) if testes else {}
        ns, out, erro = _rodar(codigo, v)
        return json.dumps({'saida': out[:4000], 'erro': erro})
    res = []
    for t in testes:
        ns, out, erro = _rodar(codigo, t.get('vars', {}))
        if erro:
            res.append({'ok': False, 'd': t['d'], 'erro': erro})
            continue
        try:
            if 'saida' in t:
                obt = _linhas(out)
                ok = obt == _linhas(t['saida'])
                res.append({'ok': ok, 'd': t['d'], 'obtido': obt[:600], 'esperado': t['saida'], 'texto': True})
            else:
                obt = eval(t['e'], ns)
                ok = _igual(obt, t['r'])
                res.append({'ok': bool(ok), 'd': t['d'], 'obtido': repr(_norm(obt))[:600], 'esperado': repr(t['r'])})
        except BaseException as e:
            res.append({'ok': False, 'd': t['d'], 'erro': {'tipo': type(e).__name__, 'msg': str(e), 'linha': None}})
    return json.dumps({'testes': res})
`;
let py = null;
onmessage = async (ev) => {
  const m = ev.data;
  if (m.tipo === 'boot') {
    const fontes = [
      { js: m.local + 'pyodide.js', base: m.local, std: m.local + 'stdlib.wasm' },
      { js: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js', base: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/' }
    ];
    for (const f of fontes) {
      try {
        if (typeof loadPyodide === 'undefined') importScripts(f.js);
        const op = { indexURL: f.base }; if (f.std) op.stdLibURL = f.std;
        py = await loadPyodide(op);
        py.runPython(HARNESS);
        postMessage({ tipo: 'pronto' }); return;
      } catch (e) { self.loadPyodide = undefined; }
    }
    postMessage({ tipo: 'falhou' }); return;
  }
  const { id, codigo, testes, modo } = m;
  try {
    const f = py.globals.get('_executar');
    const r = f(codigo, JSON.stringify(testes), modo);
    f.destroy && f.destroy();
    postMessage({ tipo: 'res', id, r });
  } catch (e) {
    postMessage({ tipo: 'res', id, r: JSON.stringify({ interno: String(e) }) });
  }
};

function arpejo(acorde){ return [acorde[0],acorde[1],acorde[2],acorde[3],acorde[0]+12,acorde[2]+12]; }
const MOODS = {
  griot:{ bpm:94, f(st,t){ const prog=[[57,60,64,67],[53,57,60,64],[48,52,55,60],[55,59,62,67]]; const bar=Math.floor(st/16)%4, s=st%16, a=prog[bar];

    if(s===0||s===6||s===10) AU.baixo(a[0]-12,t,.45,.2);

  trabalho:{ bpm:80, f(st,t,spb){ const prog=[[50,53,57,60,64],[43,53,57,59,64],[48,52,55,59,62],[45,48,52,55,60]]; const bar=Math.floor(st/16)%4, s=st%16, a=prog[bar];

    if(s===4||s===12) AU.caixa(t,.07);
    if(s%2===0){ const sw=(s%4===2)?spb*.22:0; AU.chimbal(t+sw,s%4===0?.035:.022); }
    const pent=[62,65,67,69,72,74,77]; if((bar===1||bar===3)&&(s===2||s===11||s===14)){ const r=rng(st*7+3)(); AU.pluck(NOTA(pent[Math.floor(r*pent.length)]),t,.18); } } },
  robo:{ bpm:116, f(st,t,spb){ const prog=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]]; const bar=Math.floor(st/16)%4, s=st%16, a=prog[bar];
    if(s%2===0) AU.baixo(a[0]-12+(s%4===2?12:0),t,.18,.18);
    if(s%4===0) AU.bumbo(t,.36); if(s===4||s===12) AU.caixa(t,.08); if(s%2===1) AU.chimbal(t,.03);

  suspense:{ bpm:60, f(st,t,spb){ const s=st%16;

const PERS = {
  nar:{nome:'',cor:'#f5b942',vz:{g:'m',p:.85,r:.95},blip:[130,'triangle']},
  ayo:{nome:'Mestre Ayo',cor:'#f5b942',vz:{g:'m',p:.68,r:.86},blip:[120,'triangle']},
  nina:{nome:'Nina',cor:'#2ec4b6',vz:{g:'f',p:1,r:1.02},blip:[300,'sine']},
  teo:{nome:'Téo',cor:'#ff9a5a',vz:{g:'m',p:1.15,r:1.12},blip:[210,'square']},
  kiara:{nome:'Kiara',cor:'#c79bff',vz:{g:'f',p:1.3,r:1.06},blip:[380,'triangle']},
  bit:{nome:'Bit',cor:'#7fdbff',vz:{g:'x',p:1.9,r:1.12},blip:[720,'square']},
  zuri:{nome:'Zuri',cor:'#ff8fb1',vz:{g:'f',p:.78,r:.92},blip:[240,'sine']},
  davi:{nome:'Davi',cor:'#06a77d',vz:{g:'m',p:.95,r:1},blip:[180,'sine']},
  voce:{nome:'Você',cor:'#fff4e0',vz:{g:'m',p:1,r:1},blip:[260,'sine']}
};
const FEM=/francisca|luciana|maria|vit[oó]ria|fernanda|thalita|raquel|leila|yara|camila|helena|joana|catarina|brenda|elza|manuela|female|feminin|mulher/i;
const MAS=/ant[oô]nio|daniel|felipe|f[aá]bio|ricardo|donato|j[uú]lio|humberto|val[eé]rio|nicolau|male|masculin|duarte|cristiano|jo[aã]o/i;
function vozesPt(){ try{ return speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang)); }catch(e){ return []; } }
function vozPara(who){
  const vs=vozesPt(); if(!vs.length) return null; const br=vs.filter(v=>/br/i.test(v.lang)); const pool=br.length?br:vs;
  const g=PERS[who].vz.g; let cand = g==='f'?pool.filter(v=>FEM.test(v.name)) : g==='m'?pool.filter(v=>MAS.test(v.name)) : pool.slice().reverse();
  if(!cand.length) cand=pool; const idx={ayo:0,nar:0,nina:0,teo:1,kiara:1,zuri:2,bit:0,voce:0,davi:2}[who]||0; return cand[idx%cand.length];
}
let falaAtual=null;
function falar(who,texto){
  if(!S.voz||!window.speechSynthesis||!vozesPt().length) return false;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(texto.replace(/R\$\s?/g,'').replace(/[()]/g,'')); const P=PERS[who]||PERS.nar; u.lang='pt-BR'; u.pitch=P.vz.p; u.rate=P.vz.r; const v=vozPara(who); if(v) u.voice=v; falaAtual=u; speechSynthesis.speak(u); return true; }catch(e){ return false; }
}
function calar(){ try{ speechSynthesis.cancel(); }catch(e){} }
if(window.speechSynthesis) try{ speechSynthesis.onvoiceschanged=()=>{}; speechSynthesis.getVoices(); }catch(e){}

const FX = {
  cv:null,c:null,m:'nada',p:[],
  init(){ this.cv=$('#fx'); this.c=this.cv.getContext('2d'); this.cf=$('#confete'); this.cc=this.cf.getContext('2d'); this.conf=[]; addEventListener('resize',()=>this.tam()); this.tam(); const loop=()=>{ this.passo(); requestAnimationFrame(loop); }; loop(); },
  tam(){ const d=Math.min(devicePixelRatio||1,2); [this.cv,this.cf].forEach(v=>{ v.width=innerWidth*d; v.height=innerHeight*d; }); this.d=d; },
  modo(m){ if(REDUZ) m='nada'; if(m===this.m) return; this.m=m; this.p=[]; const W=this.cv.width,H=this.cv.height;
    const n={chuva:160,vagalumes:34,poeira:50}[m]||0; for(let i=0;i<n;i++) this.p.push({x:Math.random()*W,y:Math.random()*H,v:Math.random(),a:Math.random()*6.28}); },
  passo(){ const c=this.c,W=this.cv.width,H=this.cv.height,d=this.d; c.clearRect(0,0,W,H);
    if(this.m==='chuva'){ c.strokeStyle='rgba(180,200,255,.28)'; c.lineWidth=1.2*d; c.beginPath(); for(const p of this.p){ p.y+=(14+p.v*10)*d; p.x-=3*d; if(p.y>H){p.y=-20;p.x=Math.random()*W*1.2;} c.moveTo(p.x,p.y); c.lineTo(p.x+5*d,p.y-18*d);} c.stroke(); }
    if(this.m==='vagalumes'){ for(const p of this.p){ p.a+=.02; p.x+=Math.cos(p.a*1.3+p.v*9)*.6*d; p.y+=Math.sin(p.a+p.v*5)*.4*d; const al=.35+.65*Math.max(0,Math.sin(p.a*2+p.v*20)); const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,10*d); g.addColorStop(0,`rgba(255,230,140,${al})`); g.addColorStop(1,'rgba(255,230,140,0)'); c.fillStyle=g; c.fillRect(p.x-10*d,p.y-10*d,20*d,20*d); } }
    if(this.m==='poeira'){ c.fillStyle='rgba(220,230,255,.22)'; for(const p of this.p){ p.y-=(.15+p.v*.3)*d; p.x+=Math.sin(p.a+=.01)*.3*d; if(p.y<0){p.y=H;} c.fillRect(p.x,p.y,1.6*d,1.6*d); } }
    const k=this.cc; k.clearRect(0,0,W,H); if(this.conf.length){ for(const q of this.conf){ q.vy+=.25*d; q.x+=q.vx; q.y+=q.vy; q.r+=q.vr; k.save(); k.translate(q.x,q.y); k.rotate(q.r); k.fillStyle=q.cor; k.fillRect(-5*d,-3*d,10*d,6*d); k.restore(); } this.conf=this.conf.filter(q=>q.y<H+40); } },
  confete(n=140){ if(REDUZ) return; const W=this.cf.width,d=this.d; const cores=['#f5b942','#2ec4b6','#ff6b5a','#c79bff','#4ade80','#fff4e0']; for(let i=0;i<n;i++) this.conf.push({x:W/2+(Math.random()-.5)*W*.5,y:this.cf.height*.35,vx:(Math.random()-.5)*16*d,vy:(-Math.random()*14-6)*d,r:0,vr:(Math.random()-.5)*.4,cor:cores[i%cores.length]}); }
};
function efeito(fx){
  const p=$('#palco');
  if(fx==='tremer' && !REDUZ){ p.classList.remove('tremer'); void p.offsetWidth; p.classList.add('tremer'); AU.efeito('bater'); }
  if(fx==='flash'){ const f=$('#flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
  if(fx==='glitch'){ p.classList.add('glitchado'); AU.efeito('glitch'); setTimeout(()=>p.classList.remove('glitchado'),1600); }

  if(fx==='alarme_off'){ $('#alarme').classList.remove('on'); }

let slots={l:null,r:null}, ultimo=null;

function entraBusto(who){
  if(slots.l===who||slots.r===who) return;
  let lado = !slots.l ? 'l' : !slots.r ? 'r' : (slots.l===ultimo ? 'r' : 'l');
  const velho=document.querySelector(`.busto.${lado}`); if(velho){ velho.classList.add('fora'); setTimeout(()=>velho.remove(),500); }
  const b=document.createElement('div'); b.className=`busto ${lado} fora ${who==='bit'?'bit':''}`; b.dataset.who=who; b.innerHTML=retrato(who);
  b.querySelector('.palp,.olhobit')&&b.querySelectorAll('.palp').forEach(e=>e.style.animationDuration=(4+Math.random()*2.5)+'s');
  $('#bustos').appendChild(b); slots[lado]=who; requestAnimationFrame(()=>requestAnimationFrame(()=>b.classList.remove('fora')));
  AU.efeito('whoosh');
}
function destacar(who){ document.querySelectorAll('.busto').forEach(b=>{ const f=b.dataset.who===who; b.classList.toggle('fala',f); b.classList.toggle('quieto',!f && who!=='nar'); b.classList.remove('falando'); }); ultimo=who; }
function bocaFalando(who,on){ const b=document.querySelector(`.busto[data-who="${who}"]`); if(b) b.classList.toggle('falando',on); }

let CENA=null;
function rodarCena(p){
  mostrarPainel(false); $('#dialogo').hidden=false; limpaBustos();
  CENA={falas:p.falas.map(f=>f.slice()), i:-1, dig:false, esp:false};
  if(p.fx) setBg(p.bg,p.fx);
  setTimeout(avancar,350);
}
function avancar(){
  if(!CENA) return; AU.init();
  if(CENA.dig){ completar(); return; }
  if(CENA.esp) return;
  CENA.i++;
  if(CENA.i>=CENA.falas.length){ fimCena(); return; }
  mostrarFala(CENA.falas[CENA.i]);
}
function mostrarFala(f){
  const [who,txt,op={}]=f; const t=fmt(txt);
  if(op.limpa) limpaBustos();
  if(op.bg) setBg(op.bg,op.fxmodo);
  if(op.musica) AU.humor(op.musica);
  if(op.fx) (Array.isArray(op.fx)?op.fx:[op.fx]).forEach(efeito);
  if(who!=='nar'&&who!=='voce') entraBusto(who);
  destacar(who);
  const P=PERS[who], nm=$('#nome');
  if(who==='nar'){ nm.hidden=true; } else { nm.hidden=false; nm.textContent=who==='voce'?fmt('{nome}'):P.nome; nm.style.background=P.cor; }
  const el=$('#txt'); el.className=who==='nar'?'narra':''; if(op.glitch) el.classList.add('glitch');
  $('#escolhas').innerHTML=''; $('#seta').classList.remove('on');
  if(who==='voce') calar();
  const falou = who==='voce' ? true : falar(who,t);  // fala do jogador: sem voz e sem bipes
  bocaFalando(who,true);
  CENA.dig=true; let i=0; const passo=[0,1,2,4][S.vel]||2; el.textContent='';
  clearInterval(CENA.tm); clearInterval(window.TIPO);
  CENA.tm=window.TIPO=setInterval(()=>{ if(!CENA){ clearInterval(window.TIPO); return; } i+=passo; el.textContent=t.slice(0,i); if(!falou&&S.blips&&i%4<passo){ const [f,tp]=P.blip; AU.bip(f*(0.92+Math.random()*.16),.045,.035,tp); } if(i>=t.length) completar(); },26);
  CENA.op=op; CENA.t=t;
}
function completar(){
  if(!CENA) return; clearInterval(CENA.tm); CENA.dig=false; $('#txt').textContent=CENA.t;
  const who=CENA.falas[CENA.i][0]; setTimeout(()=>bocaFalando(who,false), S.voz?Math.min(2200,CENA.t.length*45):100);
  const op=CENA.op||{};
  if(op.escolhas){ CENA.esp=true; $('#escolhas').innerHTML=op.escolhas.map((e,k)=>`<button onclick="event.stopPropagation();escolher(${k})">${esc(fmt(e.t))}</button>`).join(''); }
  else $('#seta').classList.add('on');
}
function escolher(k){ AU.efeito('clique'); const e=CENA.op.escolhas[k]; CENA.esp=false; const resp=[['voce',e.t]].concat(e.resp||[]); CENA.falas.splice(CENA.i+1,0,...resp); avancar(); }
function pularCena(){ if(!CENA) return; calar(); clearInterval(CENA.tm); CENA.falas.slice(CENA.i+1).forEach(f=>{ const op=f[2]||{}; if(op.bg) setBg(op.bg,op.fxmodo); if(op.musica) AU.humor(op.musica); if(op.fx==='alarme_off'||op.fx==='acende') efeito(op.fx); }); fimCena(); }
function fimCena(){ calar(); clearInterval(CENA&&CENA.tm); CENA=null; $('#dialogo').hidden=true; limpaBustos(); $('#cena').style.filter=''; proximo(); }

function parse(prog){
  const raiz={k:'raiz',body:[],func:null}; raiz.cur=raiz.body; const st=[raiz];
  prog.forEach((ins,i)=>{
    const B=BL[ins.k], top=st[st.length-1];

    if(B.meio){ if(top.k!=='se_livre'&&top.k!=='se_pacote') throw {i,msg:'O "senão" precisa estar dentro de um bloco "se".'}; if(top.else) throw {i,msg:'Cada "se" aceita só um "senão".'}; top.else=[]; top.cur=top.else; return; }
    const no={k:ins.k,n:ins.n,i,body:[]}; no.cur=no.body;
    if(ins.k==='func'){ if(st.length>1) throw {i,msg:'Crie a função fora dos outros blocos.'}; if(raiz.func) throw {i,msg:'Este programa já tem uma função buscar().'}; raiz.func=no; }
    else top.cur.push(no);

  {id:'c4a', titulo:'Frete grátis', enun:'A variável `total` (valor da compra) já existe. Se `total` for 100 ou mais, `frete` vale 0. Senão, `frete` vale 15.', inicial:'# total já existe\nif total >= 100:\n    frete = 0\n# complete com o else\n\nprint(frete)\n', testes:[{d:'total 100: frete 0', vars:{total:100}, e:'frete', r:0},{d:'total 99.90: frete 15', vars:{total:99.9}, e:'frete', r:15},{d:'total 250: frete 0', vars:{total:250}, e:'frete', r:0}], exige:[['\\bif\\b','Use um if para decidir.']], dica:'Depois do if, escreva else: e, na linha de baixo, com 4 espaços, frete = 15.', solucao:'if total >= 100:\n    frete = 0\nelse:\n    frete = 15\nprint(frete)'},
  {id:'c4b', titulo:'O boletim', enun:'A variável `nota` já existe. Mostre:\n`Aprovado` se a nota for 7 ou mais\n`Recuperação` se for 5 ou mais (e menor que 7)\n`Reprovado` nos outros casos', inicial:'# nota já existe\nif nota >= 7:\n    print("Aprovado")\n', testes:[{d:'nota 7: Aprovado', vars:{nota:7}, saida:'Aprovado'},{d:'nota 10: Aprovado', vars:{nota:10}, saida:'Aprovado'},{d:'nota 5: Recuperação', vars:{nota:5}, saida:'Recuperação'},{d:'nota 4.9: Reprovado', vars:{nota:4.9}, saida:'Reprovado'}], dica:'Use if, elif nota >= 5: e else:. O Python testa de cima para baixo e para no primeiro verdadeiro.', solucao:'if nota >= 7:\n    print("Aprovado")\nelif nota >= 5:\n    print("Recuperação")\nelse:\n    print("Reprovado")'},
  {id:'c4c', titulo:'O maior de três', enun:'As variáveis `a`, `b` e `c` já existem. Guarde em `maior` o maior dos três valores, usando só if/elif/else (sem a função pronta max).', inicial:'# a, b e c já existem\nmaior = a\n\nprint(maior)\n', testes:[{d:'a=3, b=9, c=4: maior é 9', vars:{a:3,b:9,c:4}, e:'maior', r:9},{d:'a=1, b=2, c=3: maior é 3', vars:{a:1,b:2,c:3}, e:'maior', r:3},{d:'a=7, b=2, c=7: maior é 7', vars:{a:7,b:2,c:7}, e:'maior', r:7},{d:'a=-1, b=-5, c=-3: maior é -1', vars:{a:-1,b:-5,c:-3}, e:'maior', r:-1}], proibido:[['\\bmax\\s*\\(','Aqui a ideia é praticar o if: resolva sem max().']], dica:'Comece supondo que a é o maior. Se b for maior que maior, troque. Depois faça o mesmo com c.', solucao:'maior = a\nif b > maior:\n    maior = b\nif c > maior:\n    maior = c\nprint(maior)'}
 ],
 c5:[
  {id:'c5a', titulo:'Contando pacotes', enun:'Use um `for` para mostrar os números de 1 a 5, um por linha. Lembre: `range(1, 6)` vai de 1 até 5.', inicial:'# use for e range\n', testes:[{d:'Mostra 1, 2, 3, 4 e 5', saida:'1\n2\n3\n4\n5'}], exige:[['\\bfor\\b','Use um laço for.']], dica:'for i in range(1, 6):  e, na linha de baixo com 4 espaços, print(i)', solucao:'for i in range(1, 6):\n    print(i)'},
  {id:'c5b', titulo:'Soma até n', enun:'A variável `n` já existe. Calcule em `soma` o total de 1 + 2 + ... + n usando um laço (sem a função pronta sum).', inicial:'# n já existe\nsoma = 0\n\nprint(soma)\n', testes:[{d:'n = 4: soma 10', vars:{n:4}, e:'soma', r:10},{d:'n = 1: soma 1', vars:{n:1}, e:'soma', r:1},{d:'n = 10: soma 55', vars:{n:10}, e:'soma', r:55}], exige:[['\\b(for|while)\\b','Use um laço (for ou while).']], proibido:[['\\bsum\\s*\\(','Aqui a ideia é praticar o laço: resolva sem sum().']], dica:'for i in range(1, n + 1): soma = soma + i. Cuidado: range para antes do último número.', solucao:'soma = 0\nfor i in range(1, n + 1):\n    soma = soma + i\nprint(soma)'},
  {id:'c5c', titulo:'A bateria do Bit', enun:'A variável `bateria` já existe. Cada viagem gasta 15. O Bit só pode viajar enquanto a bateria estiver em 20 ou mais. Conte em `viagens` quantas viagens ele faz, usando `while`.', inicial:'# bateria já existe\nviagens = 0\n\nprint(viagens)\n', testes:[{d:'bateria 100: 6 viagens', vars:{bateria:100}, e:'viagens', r:6},{d:'bateria 20: 1 viagem', vars:{bateria:20}, e:'viagens', r:1},{d:'bateria 10: 0 viagens', vars:{bateria:10}, e:'viagens', r:0}], exige:[['\\bwhile\\b','Use um laço while.']], dica:'while bateria >= 20: e, dentro, diminua 15 da bateria e some 1 em viagens. Se esquecer de diminuir, vira loop infinito!', solucao:'viagens = 0\nwhile bateria >= 20:\n    bateria = bateria - 15\n    viagens = viagens + 1\nprint(viagens)'}
 ],
 c6:[
  {id:'c6a', titulo:'Primeiro e último', enun:'A lista `produtos` já existe. Guarde em `primeiro` o primeiro item e em `ultimo` o último item. Funciona para listas de qualquer tamanho.', inicial:'# produtos já existe\nprimeiro = \nultimo = \nprint(primeiro, ultimo)\n', testes:[{d:'["caju", "dendê", "tapioca"]: caju e tapioca', vars:{produtos:['caju','dendê','tapioca']}, e:'[primeiro, ultimo]', r:['caju','tapioca']},{d:'["cocada"]: cocada e cocada', vars:{produtos:['cocada']}, e:'[primeiro, ultimo]', r:['cocada','cocada']},{d:'lista com 4 itens', vars:{produtos:['a','b','c','d']}, e:'[primeiro, ultimo]', r:['a','d']}], dica:'O primeiro é produtos[0]. O último é produtos[-1].', solucao:'primeiro = produtos[0]\nultimo = produtos[-1]\nprint(primeiro, ultimo)'},
  {id:'c6b', titulo:'Pacotes pesados', enun:'A lista `pesos` já existe. Conte em `pesados` quantos pacotes pesam mais de 5 kg.', inicial:'# pesos já existe\npesados = 0\n\nprint(pesados)\n', testes:[{d:'[2, 7, 5, 9]: 2 pesados', vars:{pesos:[2,7,5,9]}, e:'pesados', r:2},{d:'lista vazia: 0', vars:{pesos:[]}, e:'pesados', r:0},{d:'[6, 6, 6]: 3 pesados', vars:{pesos:[6,6,6]}, e:'pesados', r:3}], dica:'for p in pesos: e, dentro, if p > 5: some 1 em pesados. Repare: 5 não é maior que 5.', solucao:'pesados = 0\nfor p in pesos:\n    if p > 5:\n        pesados = pesados + 1\nprint(pesados)'},
  {id:'c6c', titulo:'Lista de entregas', enun:'Comece com a lista vazia `entregas`. Use `append` para adicionar "Rua A", "Rua B" e "Rua C", nessa ordem. Depois guarde em `total` o tamanho da lista com `len`.', inicial:'entregas = []\n# adicione os endereços\n\ntotal = \nprint(entregas, total)\n', testes:[{d:'entregas tem os 3 endereços na ordem', e:'entregas', r:['Rua A','Rua B','Rua C']},{d:'total vale 3', e:'total', r:3}], exige:[['\\.append\\s*\\(','Use entregas.append(...) para adicionar.'],['\\blen\\s*\\(','Use len(entregas) para contar.']], dica:'entregas.append("Rua A") adiciona no fim da lista. len(entregas) diz quantos itens ela tem.', solucao:'entregas = []\nentregas.append("Rua A")\nentregas.append("Rua B")\nentregas.append("Rua C")\ntotal = len(entregas)\nprint(entregas, total)'}
 ],
 c7:[
  {id:'c7a', titulo:'A função dobro', enun:'Crie a função `dobro(x)`, que retorna o dobro de `x`.', inicial:'def dobro(x):\n    # complete\n\nprint(dobro(4))\n', testes:[{d:'dobro(4) retorna 8', e:'dobro(4)', r:8},{d:'dobro(0) retorna 0', e:'dobro(0)', r:0},{d:'dobro(-3) retorna -6', e:'dobro(-3)', r:-6}], dica:'Dentro da função, com 4 espaços: return x * 2', solucao:'def dobro(x):\n    return x * 2\n\nprint(dobro(4))'},
  {id:'c7b', titulo:'A função frete', enun:'Crie `frete(peso)`: até 2 kg (incluindo 2), o frete é 10. Acima disso, é 10 + (peso − 2) × 3.', inicial:'def frete(peso):\n    # complete\n\nprint(frete(5))\n', testes:[{d:'frete(1) retorna 10', e:'frete(1)', r:10},{d:'frete(2) retorna 10 (fronteira)', e:'frete(2)', r:10},{d:'frete(5) retorna 19', e:'frete(5)', r:19},{d:'frete(3.5) retorna 14.5', e:'frete(3.5)', r:14.5}], dica:'if peso <= 2: return 10, else: return 10 + (peso - 2) * 3', solucao:'def frete(peso):\n    if peso <= 2:\n        return 10\n    else:\n        return 10 + (peso - 2) * 3\n\nprint(frete(5))'},
  {id:'c7c', titulo:'A média das notas', enun:'Crie `media(notas)`, que recebe uma lista e retorna a média. Se a lista estiver vazia, retorne 0 (dividir por zero dá erro!).', inicial:'def media(notas):\n    # complete\n\nprint(media([7, 9, 8]))\n', testes:[{d:'media([7, 9, 8]) retorna 8', e:'media([7, 9, 8])', r:8},{d:'media([5, 6]) retorna 5.5', e:'media([5, 6])', r:5.5},{d:'media([10]) retorna 10', e:'media([10])', r:10},{d:'media([]) retorna 0', e:'media([])', r:0}], dica:'Primeiro: if len(notas) == 0: return 0. Depois some as notas num laço e divida pela quantidade, len(notas).', solucao:'def media(notas):\n    if len(notas) == 0:\n        return 0\n    soma = 0\n    for n in notas:\n        soma = soma + n\n    return soma / len(notas)\n\nprint(media([7, 9, 8]))'}
 ],
 c8:[
  {id:'c8a', titulo:'Bug 1: o par ímpar', enun:'A função `eh_par(n)` deveria retornar True para números pares, mas está errada. Encontre e conserte o bug.', inicial:'def eh_par(n):\n    return n % 2 == 1\n\nprint(eh_par(4))\n', testes:[{d:'eh_par(4) retorna True', e:'eh_par(4)', r:true},{d:'eh_par(7) retorna False', e:'eh_par(7)', r:false},{d:'eh_par(0) retorna True', e:'eh_par(0)', r:true}], dica:'Faça um teste de mesa com n = 4: quanto é 4 % 2? Esse resultado é igual a 1?', solucao:'def eh_par(n):\n    return n % 2 == 0\n\nprint(eh_par(4))'},
  {id:'c8b', titulo:'Bug 2: a soma que esquece um', enun:'`soma_ate(n)` deveria somar de 1 até n, mas soma_ate(4) está dando 6 em vez de 10. Conserte.', inicial:'def soma_ate(n):\n    total = 0\n    for i in range(1, n):\n        total = total + i\n    return total\n\nprint(soma_ate(4))\n', testes:[{d:'soma_ate(4) retorna 10', e:'soma_ate(4)', r:10},{d:'soma_ate(1) retorna 1', e:'soma_ate(1)', r:1},{d:'soma_ate(10) retorna 55', e:'soma_ate(10)', r:55}], dica:'range(1, n) para antes de n. Para incluir o n, o fim precisa ser n + 1.', solucao:'def soma_ate(n):\n    total = 0\n    for i in range(1, n + 1):\n        total = total + i\n    return total\n\nprint(soma_ate(4))'},
  {id:'c8c', titulo:'Bug 3: o alerta do Jonas', enun:'Esta é a versão em Python do script do Jonas. A regra está no comentário. Conserte a função para seguir a regra.', inicial:'def alerta(dias):\n    # Regra: menos de 3 dias = "URGENTE"\n    if dias > 3:\n        return "URGENTE"\n    else:\n        return "Faltam " + str(dias) + " dias"\n\nprint(alerta(7))\n', testes:[{d:'alerta(7) retorna "Faltam 7 dias"', e:'alerta(7)', r:'Faltam 7 dias'},{d:'alerta(2) retorna "URGENTE"', e:'alerta(2)', r:'URGENTE'},{d:'alerta(3) retorna "Faltam 3 dias" (3 não é menos de 3)', e:'alerta(3)', r:'Faltam 3 dias'}], dica:'"Menos de 3" é dias < 3. Teste a fronteira: com 3 dias ainda não é urgente.', solucao:'def alerta(dias):\n    # Regra: menos de 3 dias = "URGENTE"\n    if dias < 3:\n        return "URGENTE"\n    else:\n        return "Faltam " + str(dias) + " dias"\n\nprint(alerta(7))'}
 ],
 c10:[
  {id:'c10a', titulo:'Recortando o código', enun:'A variável `codigo` já existe, no formato "BA-2026-0042". Guarde em `estado` as 2 primeiras letras e em `numero` os 4 últimos caracteres. Use fatias: `codigo[inicio:fim]`.', inicial:'# codigo já existe\nestado = \nnumero = \nprint(estado, numero)\n', testes:[{d:'BA-2026-0042: BA e 0042', vars:{codigo:'BA-2026-0042'}, e:'[estado, numero]', r:['BA','0042']},{d:'PE-2025-1234: PE e 1234', vars:{codigo:'PE-2025-1234'}, e:'[estado, numero]', r:['PE','1234']},{d:'CE-2026-0007: CE e 0007', vars:{codigo:'CE-2026-0007'}, e:'[estado, numero]', r:['CE','0007']}], dica:'codigo[:2] vai do início até antes do índice 2. codigo[-4:] pega os 4 últimos.', solucao:'estado = codigo[:2]\nnumero = codigo[-4:]\nprint(estado, numero)'},
  {id:'c10b', titulo:'Mensagem ao cliente', enun:'Crie `mensagem(nome, codigo)`, que retorna exatamente: `Olá, NOME! Seu pedido CODIGO saiu para entrega.` Use uma f-string: `f"Olá, {nome}! ..."`.', inicial:'def mensagem(nome, codigo):\n    # complete com uma f-string\n\nprint(mensagem("Dona Lúcia", "BA-0042"))\n', testes:[{d:'Dona Lúcia, BA-0042', e:'mensagem("Dona Lúcia", "BA-0042")', r:'Olá, Dona Lúcia! Seu pedido BA-0042 saiu para entrega.'},{d:'Davi, PE-0001', e:'mensagem("Davi", "PE-0001")', r:'Olá, Davi! Seu pedido PE-0001 saiu para entrega.'}], dica:'return f"Olá, {nome}! Seu pedido {codigo} saiu para entrega." (confira vírgula, exclamação e ponto final)', solucao:'def mensagem(nome, codigo):\n    return f"Olá, {nome}! Seu pedido {codigo} saiu para entrega."\n\nprint(mensagem("Dona Lúcia", "BA-0042"))'},
  {id:'c10c', titulo:'Contando vogais', enun:'Crie `contar_vogais(texto)`, que retorna quantas letras do texto são vogais sem acento (a, e, i, o, u), maiúsculas ou minúsculas.', inicial:'def contar_vogais(texto):\n    # complete\n\nprint(contar_vogais("Salvador"))\n', testes:[{d:'"Salvador" tem 3', e:'contar_vogais("Salvador")', r:3},{d:'"Python" tem 1', e:'contar_vogais("Python")', r:1},{d:'"AEIOU" tem 5', e:'contar_vogais("AEIOU")', r:5},{d:'texto vazio tem 0', e:'contar_vogais("")', r:0}], exige:[['\\b(for|while)\\b','Use um laço para olhar letra por letra.']], dica:'total = 0; for letra in texto: if letra in "aeiouAEIOU": total = total + 1', solucao:'def contar_vogais(texto):\n    total = 0\n    for letra in texto:\n        if letra in "aeiouAEIOU":\n            total = total + 1\n    return total\n\nprint(contar_vogais("Salvador"))'}
 ],
 c11:[
  {id:'c11a', titulo:'A ficha do cliente', enun:'Crie o dicionário `cliente` com três chaves: "nome" valendo "Dona Lúcia", "bairro" valendo "Pelourinho" e "pedidos" valendo o inteiro 3.', inicial:'cliente = {\n    "nome": "Dona Lúcia",\n    # complete com bairro e pedidos\n}\nprint(cliente)\n', testes:[{d:'cliente tem nome, bairro e pedidos certos', e:'cliente', r:{nome:'Dona Lúcia',bairro:'Pelourinho',pedidos:3}},{d:'cliente["pedidos"] é o inteiro 3', e:'cliente["pedidos"]', r:3}], dica:'Cada par fica assim: "chave": valor, separados por vírgula.', solucao:'cliente = {\n    "nome": "Dona Lúcia",\n    "bairro": "Pelourinho",\n    "pedidos": 3,\n}\nprint(cliente)'},
  {id:'c11b', titulo:'Repor o estoque', enun:'Crie `repor(estoque, item, qtd)`: se o item já existe no dicionário, some `qtd` ao valor. Se não existe, crie o item com `qtd`. Retorne o dicionário.', inicial:'def repor(estoque, item, qtd):\n    # complete\n\nprint(repor({"caju": 3}, "caju", 2))\n', testes:[{d:'caju 3 + 2 = 5', e:'repor({"caju": 3}, "caju", 2)', r:{caju:5}},{d:'suco novo com 4', e:'repor({"caju": 3}, "suco", 4)', r:{caju:3,suco:4}},{d:'estoque vazio ganha cocada', e:'repor({}, "cocada", 1)', r:{cocada:1}}], dica:'if item in estoque: estoque[item] = estoque[item] + qtd, else: estoque[item] = qtd. No fim, return estoque.', solucao:'def repor(estoque, item, qtd):\n    if item in estoque:\n        estoque[item] = estoque[item] + qtd\n    else:\n        estoque[item] = qtd\n    return estoque\n\nprint(repor({"caju": 3}, "caju", 2))'},
  {id:'c11c', titulo:'Pedidos por bairro', enun:'Crie `contar(bairros)`, que recebe uma lista de bairros (um por pedido) e retorna um dicionário com quantos pedidos cada bairro teve.', inicial:'def contar(bairros):\n    contagem = {}\n    # complete\n    return contagem\n\nprint(contar(["Barra", "Pelourinho", "Barra"]))\n', testes:[{d:'Barra 2, Pelourinho 1', e:'contar(["Barra", "Pelourinho", "Barra"])', r:{Barra:2,Pelourinho:1}},{d:'lista vazia: dicionário vazio', e:'contar([])', r:{}},{d:'Itapuã 1', e:'contar(["Itapuã"])', r:{'Itapuã':1}}], dica:'for b in bairros: se b já está em contagem, some 1; senão, comece com 1.', solucao:'def contar(bairros):\n    contagem = {}\n    for b in bairros:\n        if b in contagem:\n            contagem[b] = contagem[b] + 1\n        else:\n            contagem[b] = 1\n    return contagem\n\nprint(contar(["Barra", "Pelourinho", "Barra"]))'}
 ],
 c12:[
  {id:'c12a', titulo:'Pacotes no armazém', enun:'A matriz `mapa` já existe: cada número é a quantidade de pacotes numa prateleira. Some tudo em `total`, usando um laço dentro de outro (sem a função sum).', inicial:'# mapa já existe\ntotal = 0\n\nprint(total)\n', testes:[{d:'[[1, 2], [3, 4]]: 10', vars:{mapa:[[1,2],[3,4]]}, e:'total', r:10},{d:'[[5, 0, 1]]: 6', vars:{mapa:[[5,0,1]]}, e:'total', r:6},{d:'linhas vazias: 0', vars:{mapa:[[],[]]}, e:'total', r:0}], exige:[['for[\\s\\S]*for','Use um laço dentro de outro.']], proibido:[['\\bsum\\s*\\(','Aqui a ideia é praticar os laços: resolva sem sum().']], dica:'for linha in mapa: e, dentro, for qtd in linha: total = total + qtd', solucao:'total = 0\nfor linha in mapa:\n    for qtd in linha:\n        total = total + qtd\nprint(total)'},
  {id:'c12b', titulo:'Contando no mapa', enun:'Crie `contar(mapa, simbolo)`. O `mapa` é uma lista de textos, um por linha, como no robô ("#" é parede). Retorne quantas vezes `simbolo` aparece no mapa inteiro.', inicial:'def contar(mapa, simbolo):\n    # complete\n\nprint(contar(["#.#", "..#"], "#"))\n', testes:[{d:'3 paredes', e:'contar(["#.#", "..#"], "#")', r:3},{d:'nenhuma parede', e:'contar(["...", "..."], "#")', r:0},{d:'5 pacotes P', e:'contar(["P.P", "PPP"], "P")', r:5}], dica:'Para cada linha do mapa, para cada caractere da linha: se for igual ao símbolo, some 1.', solucao:'def contar(mapa, simbolo):\n    total = 0\n    for linha in mapa:\n        for c in linha:\n            if c == simbolo:\n                total = total + 1\n    return total\n\nprint(contar(["#.#", "..#"], "#"))'},
  {id:'c12c', titulo:'A linha mais cheia', enun:'Crie `linha_mais_cheia(matriz)`, que retorna o índice da linha com a maior soma. Em caso de empate, a primeira.', inicial:'def linha_mais_cheia(matriz):\n    # complete\n\nprint(linha_mais_cheia([[1, 2], [5, 0], [1, 1]]))\n', testes:[{d:'[[1,2],[5,0],[1,1]]: linha 1', e:'linha_mais_cheia([[1, 2], [5, 0], [1, 1]])', r:1},{d:'empate: a primeira (0)', e:'linha_mais_cheia([[3], [3]])', r:0},{d:'9 contra 8: linha 0', e:'linha_mais_cheia([[0, 0, 9], [4, 4, 0]])', r:0}], dica:'Guarde a melhor soma e o melhor índice. Para cada i, calcule a soma da linha i; se for maior que a melhor, atualize os dois.', solucao:'def linha_mais_cheia(matriz):\n    melhor = 0\n    maior = sum(matriz[0])\n    for i in range(len(matriz)):\n        s = sum(matriz[i])\n        if s > maior:\n            maior = s\n            melhor = i\n    return melhor\n\nprint(linha_mais_cheia([[1, 2], [5, 0], [1, 1]]))'}
 ],
 c13:[
  {id:'c13a', titulo:'Busca linear', enun:'Crie `buscar(lista, alvo)`, que retorna o índice da primeira vez que `alvo` aparece, ou -1 se não estiver na lista. Sem usar o método pronto `.index()`.', inicial:'def buscar(lista, alvo):\n    # complete\n\nprint(buscar([4, 8, 15], 8))\n', testes:[{d:'8 está no índice 1', e:'buscar([4, 8, 15], 8)', r:1},{d:'16 não está: -1', e:'buscar([4, 8, 15], 16)', r:-1},{d:'lista vazia: -1', e:'buscar([], 1)', r:-1},{d:'repetido: primeira posição (0)', e:'buscar([7, 7], 7)', r:0}], proibido:[['\\.index\\s*\\(','Aqui a ideia é escrever a busca você mesmo: sem .index().']], dica:'for i in range(len(lista)): if lista[i] == alvo: return i. Depois do laço, return -1.', solucao:'def buscar(lista, alvo):\n    for i in range(len(lista)):\n        if lista[i] == alvo:\n            return i\n    return -1\n\nprint(buscar([4, 8, 15], 8))'},
  {id:'c13b', titulo:'Busca binária', enun:'Complete `busca_binaria(lista, alvo)` para uma lista ordenada: olhe o meio; se for o alvo, retorne o índice; se o meio for menor, descarte a esquerda; se for maior, descarte a direita. Se não achar, retorne -1.', inicial:'def busca_binaria(lista, alvo):\n    inicio = 0\n    fim = len(lista) - 1\n    while inicio <= fim:\n        meio = (inicio + fim) // 2\n        # complete: compare lista[meio] com alvo\n        break  # apague esta linha quando completar\n    return -1\n\nprint(busca_binaria([1, 3, 5, 7, 9, 11], 7))\n', testes:[{d:'7 está no índice 3', e:'busca_binaria([1, 3, 5, 7, 9, 11], 7)', r:3},{d:'1 está no índice 0', e:'busca_binaria([1, 3, 5, 7, 9, 11], 1)', r:0},{d:'11 está no índice 5', e:'busca_binaria([1, 3, 5, 7, 9, 11], 11)', r:5},{d:'4 não está: -1', e:'busca_binaria([1, 3, 5, 7, 9, 11], 4)', r:-1},{d:'lista vazia: -1', e:'busca_binaria([], 5)', r:-1}], exige:[['\\bwhile\\b','Use o laço while.']], dica:'if lista[meio] == alvo: return meio / elif lista[meio] < alvo: inicio = meio + 1 / else: fim = meio - 1', solucao:'def busca_binaria(lista, alvo):\n    inicio = 0\n    fim = len(lista) - 1\n    while inicio <= fim:\n        meio = (inicio + fim) // 2\n        if lista[meio] == alvo:\n            return meio\n        elif lista[meio] < alvo:\n            inicio = meio + 1\n        else:\n            fim = meio - 1\n    return -1\n\nprint(busca_binaria([1, 3, 5, 7, 9, 11], 7))'},
  {id:'c13c', titulo:'O método da bolha', enun:'Crie `ordenar(lista)`, que retorna a lista em ordem crescente usando o método da bolha (sem `sorted()` nem `.sort()`).', inicial:'def ordenar(lista):\n    lista = lista[:]  # copia para não mexer na original\n    # complete\n    return lista\n\nprint(ordenar([5, 2, 8, 1, 4]))\n', testes:[{d:'[5, 2, 8, 1, 4] ordenada', e:'ordenar([5, 2, 8, 1, 4])', r:[1,2,4,5,8]},{d:'lista vazia', e:'ordenar([])', r:[]},{d:'com repetidos', e:'ordenar([3, 3, 1])', r:[1,3,3]},{d:'já ordenada', e:'ordenar([1, 2, 3])', r:[1,2,3]}], proibido:[['\\bsorted\\s*\\(','Aqui a ideia é escrever a bolha: sem sorted().'],['\\.sort\\s*\\(','Aqui a ideia é escrever a bolha: sem .sort().']], dica:'Dois laços: for i in range(len(lista)): for j in range(len(lista) - 1 - i): se lista[j] > lista[j + 1], troque os dois.', solucao:'def ordenar(lista):\n    lista = lista[:]\n    for i in range(len(lista)):\n        for j in range(len(lista) - 1 - i):\n            if lista[j] > lista[j + 1]:\n                lista[j], lista[j + 1] = lista[j + 1], lista[j]\n    return lista\n\nprint(ordenar([5, 2, 8, 1, 4]))'}
 ],

  {id:'c14b', titulo:'Contagem regressiva', enun:'Crie `contagem(n)` com recursão: retorna a lista [n, n − 1, ..., 1]. Para n = 0, retorna a lista vazia.', inicial:'def contagem(n):\n    # caso base: n == 0\n    # passo: [n] + contagem(n - 1)\n\nprint(contagem(3))\n', testes:[{d:'contagem(3) = [3, 2, 1]', e:'contagem(3)', r:[3,2,1]},{d:'contagem(1) = [1]', e:'contagem(1)', r:[1]},{d:'contagem(0) = []', e:'contagem(0)', r:[]}], exige:[['def\\s+contagem[\\s\\S]*\\bcontagem\\s*\\(','Use recursão: a função precisa chamar contagem(...) dentro dela.']], dica:'if n == 0: return []. Senão: return [n] + contagem(n - 1)', solucao:'def contagem(n):\n    if n == 0:\n        return []\n    return [n] + contagem(n - 1)\n\nprint(contagem(3))'},

 quiz:{ nome:'Corretor de Quiz', repo:'corretor-quiz', resumo:'Corrige as respostas de um quiz, calcula a porcentagem de acertos e mostra uma mensagem de incentivo de acordo com o resultado.', habs:['Listas','for','Operadores','if/elif/else','Funções'],

 rastreio:{ parte:2, nome:'Rastreador de Pedidos', repo:'rastreador-pedidos', resumo:'Organiza códigos de rastreio no formato BA-0042: separa estado e número, conta pedidos por estado e lista os atrasados em ordem.', habs:['Strings','split()','Dicionários','Funções','sorted()'],

   {id:'pr2', titulo:'Etapa 2: pedidos por estado', enun:'Abaixo, crie `por_estado(codigos)`: recebe uma lista de códigos e retorna um dicionário com quantos pedidos cada estado tem. Use a sua função `separar`.', inicial:'\ndef por_estado(codigos):\n    # complete\n\nprint(por_estado(["BA-0001", "PE-0002", "BA-0003"]))\n', testes:[{d:'BA 2, PE 1', e:'por_estado(["BA-0001", "PE-0002", "BA-0003"])', r:{BA:2,PE:1}},{d:'sem códigos: vazio', e:'por_estado([])', r:{}}], dica:'contagem = {}; for c in codigos: estado = separar(c)[0]; some 1 em contagem[estado] (criando com 1 se não existir).', solucao:'def por_estado(codigos):\n    contagem = {}\n    for c in codigos:\n        estado = separar(c)[0]\n        if estado in contagem:\n            contagem[estado] = contagem[estado] + 1\n        else:\n            contagem[estado] = 1\n    return contagem\n\nprint(por_estado(["BA-0001", "PE-0002", "BA-0003"]))'},

 rotas:{ parte:2, nome:'Ordenador de Rotas', repo:'ordenador-rotas', resumo:'Planeja a ordem das entregas num mapa em grade: calcula distâncias e monta a rota indo sempre ao destino mais próximo.', habs:['Listas','Funções','abs()','while','Algoritmo guloso'],
  etapas:[
   {id:'pt1', titulo:'Etapa 1: a distância', enun:'Crie `distancia(a, b)`. Cada ponto é uma lista `[x, y]` num mapa em grade, onde só dá para andar na horizontal e na vertical. A distância é |x1 − x2| + |y1 − y2|. Use `abs()`.', inicial:'def distancia(a, b):\n    # complete\n\nprint(distancia([0, 0], [3, 4]))\n', testes:[{d:'(0,0) até (3,4): 7', e:'distancia([0, 0], [3, 4])', r:7},{d:'mesmo ponto: 0', e:'distancia([2, 5], [2, 5])', r:0},{d:'(5,1) até (1,3): 6', e:'distancia([5, 1], [1, 3])', r:6}], dica:'return abs(a[0] - b[0]) + abs(a[1] - b[1])', solucao:'def distancia(a, b):\n    return abs(a[0] - b[0]) + abs(a[1] - b[1])\n\nprint(distancia([0, 0], [3, 4]))'},
   {id:'pt2', titulo:'Etapa 2: o mais próximo', enun:'Abaixo, crie `mais_proximo(origem, destinos)`, que retorna o índice do destino mais perto da origem. Em empate, o primeiro.', inicial:'\ndef mais_proximo(origem, destinos):\n    # complete\n\nprint(mais_proximo([0, 0], [[5, 5], [1, 2], [3, 0]]))\n', testes:[{d:'o índice 1 está mais perto (empata com o 2, vence o primeiro)', e:'mais_proximo([0, 0], [[5, 5], [1, 2], [3, 0]])', r:1},{d:'um só destino: índice 0', e:'mais_proximo([2, 2], [[2, 3]])', r:0},{d:'o último é o mais perto', e:'mais_proximo([9, 9], [[0, 0], [5, 5], [9, 8]])', r:2}], dica:'melhor = 0; para cada i, se distancia(origem, destinos[i]) < distancia(origem, destinos[melhor]), melhor = i.', solucao:'def mais_proximo(origem, destinos):\n    melhor = 0\n    for i in range(len(destinos)):\n        if distancia(origem, destinos[i]) < distancia(origem, destinos[melhor]):\n            melhor = i\n    return melhor\n\nprint(mais_proximo([0, 0], [[5, 5], [1, 2], [3, 0]]))'},
   {id:'pt3', titulo:'Etapa 3: a rota', enun:'Crie `rota(origem, destinos)`: partindo da origem, vá sempre ao destino mais próximo ainda não visitado. Retorne a lista de destinos na ordem da visita. Não altere a lista original.', inicial:'\ndef rota(origem, destinos):\n    restantes = destinos[:]\n    # complete\n\nprint(rota([0, 0], [[5, 5], [1, 0], [2, 2]]))\n', testes:[{d:'três paradas na ordem certa', e:'rota([0, 0], [[5, 5], [1, 0], [2, 2]])', r:[[1,0],[2,2],[5,5]]},{d:'sem destinos: rota vazia', e:'rota([0, 0], [])', r:[]},{d:'não altera a lista original', e:'(lambda d: [rota([0, 0], d), d])([[3, 3], [1, 1]])', r:[[[1,1],[3,3]],[[3,3],[1,1]]]}], dica:'ordem = []; atual = origem; enquanto houver restantes: i = mais_proximo(atual, restantes); atual = restantes.pop(i); ordem.append(atual). return ordem', solucao:'def rota(origem, destinos):\n    restantes = destinos[:]\n    ordem = []\n    atual = origem\n    while len(restantes) > 0:\n        i = mais_proximo(atual, restantes)\n        atual = restantes.pop(i)\n        ordem.append(atual)\n    return ordem\n\nprint(rota([0, 0], [[5, 5], [1, 0], [2, 2]]))'}

const PY = {
  w:null, estado:'parado', fila:{}, seq:0,
  iniciar(){
    if(this.w) return;
    try{ const blob=new Blob([document.getElementById('pyworker').textContent],{type:'text/javascript'}); this.w=new Worker(URL.createObjectURL(blob)); this.w.postMessage({tipo:'boot', local:new URL('pyodide/',location.href).href}); }catch(e){ this.estado='falhou'; this.avisa(); return; }
    this.estado='carregando'; this.avisa();
    this.w.onmessage=e=>{ const m=e.data;
      if(m.tipo==='pronto'){ this.estado='pronto'; clearTimeout(this.tb); this.avisa(); }
      else if(m.tipo==='falhou'){ this.estado='falhou'; this.avisa(); }
      else if(m.tipo==='res'){ const cb=this.fila[m.id]; if(cb){ delete this.fila[m.id]; try{ cb(JSON.parse(m.r)); }catch(err){ cb({interno:String(err)}); } } } };
    this.w.onerror=()=>{ this.estado='falhou'; this.avisa(); };
    clearTimeout(this.tb); this.tb=setTimeout(()=>{ if(this.estado==='carregando'){ this.estado='falhou'; this.avisa(); } },90000);
  },
  avisa(){ const el=$('#pystatus'); if(el) el.innerHTML=statusPy(); },
  rodar(codigo,testes,modo){ return new Promise(res=>{
    if(this.estado!=='pronto') return res({indisponivel:true});
    const id=++this.seq; this.fila[id]=res; this.w.postMessage({id,codigo,testes,modo});
    setTimeout(()=>{ if(this.fila[id]){ delete this.fila[id]; try{ this.w.terminate(); }catch(e){} this.w=null; this.estado='parado'; this.iniciar(); res({timeout:true}); } },6000);
  }); }
};
function statusPy(){ const e=PY.estado; const t={parado:'Python desligado',carregando:'Preparando o Python…',pronto:'Python pronto',falhou:'Python indisponível'}[e]; return `<span class="pyst ${e==='pronto'?'ok':e==='falhou'?'erro':'carregando'}"><i></i>${t}</span>`; }
function md(t){ return esc(t).split('\n').map(l=>`<p>${l.replace(/`([^`]+)`/g,'<code>$1</code>')}</p>`).join(''); }
function dicaErro(e){ return ({SyntaxError:'Erro de sintaxe: confira os dois-pontos no fim de if, else, for, while e def, os parênteses e as aspas. Uma linha incompleta (como "resto = " sem nada depois) também dá esse erro.', IndentationError:'Erro de indentação: o que fica dentro de if, for, while ou def precisa começar com 4 espaços, e uma função não pode ficar vazia.', NameError:'Nome desconhecido: você usou uma variável ou função que não existe. Confira a escrita (maiúsculas contam: True, não true).', TypeError:'Tipos misturados: por exemplo, somar texto com número, ou chamar uma função com a quantidade errada de valores.', IndexError:'Índice fora da lista: você pediu uma posição que não existe.', ZeroDivisionError:'Divisão por zero: confira o caso da lista vazia.', RuntimeError:'', RecursionError:'A função chamou a si mesma sem parar.'})[e.tipo]||''; }
function txtErro(e){ return `${e.tipo}${e.linha?' na linha '+e.linha:''}: ${e.msg}`; }
function varsTxt(v){ return Object.entries(v).map(([k,x])=>`${k} = ${JSON.stringify(x).replace(/^true$/,'True').replace(/^false$/,'False').replace(/,/g,', ')}`).join('   '); }

function telaExercicio(ex, ctx){
  const salvo = S.codigos[ex.id]!==undefined ? S.codigos[ex.id] : (ctx.inicial!==undefined?ctx.inicial:ex.inicial);
  let falhas=0;
  card(ctx.barra, `<div class="olho">${esc(ctx.olho)}</div>${ctx.topo||''}<h2>${esc(ex.titulo)}</h2>${ctx.intro||''}
    <div class="enun">${md(ex.enun)}</div>
    ${ex.testes[0].vars?`<div class="real"><b>O teste define:</b> <code>${esc(varsTxt(ex.testes[0].vars))}</code><br>Ao testar, outros valores também são usados. Não sobrescreva essas variáveis.</div>`:''}
    <div class="pyhead"><span>main.py</span><span id="pystatus">${statusPy()}</span></div>
    <textarea id="ed" class="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Editor de código Python">${esc(salvo)}</textarea>
    <div class="simbolos">${['⇥',':','(',')','[',']','"','=','==','+','-','*','/','%','<','>','>='].map(x=>`<button data-s="${esc(x)}" aria-label="Inserir ${esc(x==='⇥'?'4 espaços':x)}">${esc(x)}</button>`).join('')}</div>
    <div class="ctrl"><button class="btn sec" id="erodar">▶ Rodar</button><button class="btn" id="etestar">✓ Testar</button><button class="btn sec mini" id="edica">Dica</button><button class="btn sec mini" id="esol" hidden>Ver solução</button><button class="btn sec mini" id="ereset">Restaurar código</button></div>
    <div class="console" id="econs" hidden></div><div id="eres"></div>`);
  PY.iniciar();
  const ed=$('#ed');
  const ins=(t)=>{ const a=ed.selectionStart,b=ed.selectionEnd; ed.value=ed.value.slice(0,a)+t+ed.value.slice(b); ed.selectionStart=ed.selectionEnd=a+t.length; ed.focus(); guarda(); };
  let tg; const guarda=()=>{ clearTimeout(tg); tg=setTimeout(()=>{ S.codigos[ex.id]=ed.value; salvar(); },300); };
  ed.addEventListener('input',guarda);
  ed.addEventListener('keydown',e=>{
    if(e.key==='Tab'){ e.preventDefault(); ins('    '); }
    else if(e.key==='Enter'){ const a=ed.selectionStart; const linha=ed.value.slice(0,a).split('\n').pop(); let ind=(linha.match(/^\s*/)||[''])[0]; if(/:\s*$/.test(linha)) ind+='    '; e.preventDefault(); ins('\n'+ind); }
  });
  document.querySelectorAll('.simbolos button').forEach(b=>b.onclick=()=>{ const s=b.dataset.s; ins(s==='⇥'?'    ':s.length===1&&'():[]'.includes(s)?s:(/[=<>+\-*\/%]/.test(s)?' '+s+' ':s)); });
  $('#ereset').onclick=()=>{ ed.value=ctx.inicial!==undefined?ctx.inicial:ex.inicial; guarda(); $('#eres').innerHTML=''; $('#econs').hidden=true; };
  $('#edica').onclick=()=>{ $('#eres').innerHTML=`<div class="msg info"><b>Dica:</b> ${esc(ex.dica)}</div>`; };
  const mostraSol=()=>{ $('#eres').innerHTML=`<div class="msg info"><b>Uma solução possível</b> (existem outras!). Leia linha por linha antes de usar:</div><pre class="cod">${realce(ex.solucao)}</pre><button class="btn sec mini" id="eusar">Colocar no editor</button>`; $('#eusar').onclick=()=>{ ed.value=ex.solucao; guarda(); $('#eres').innerHTML='<div class="msg info">Solução no editor. Agora clique em ✓ Testar.</div>'; }; };
  $('#esol').onclick=mostraSol;
  const indisponivel=()=>{ if(PY.estado==='carregando'||PY.estado==='parado'){ $('#eres').innerHTML='<div class="msg info">O Python ainda está carregando (só demora na primeira vez). Tente de novo em alguns segundos.</div>'; return; }
    $('#eres').innerHTML=`<div class="msg erro">Não consegui carregar o Python neste aparelho ou nesta conexão. Compare o seu código com a solução abaixo e siga em frente.</div><pre class="cod">${realce(ex.solucao)}</pre><div class="acoes"><span></span><button class="btn" id="eseguir">${esc(ctx.rotulo)}</button></div>`; $('#eseguir').onclick=()=>ctx.ok(ed.value,true); };
  $('#erodar').onclick=async()=>{ AU.init(); const c=$('#econs'); c.hidden=false; c.innerHTML='<span class="t">rodando…</span>'; const r=await PY.rodar(ed.value,ex.testes,'rodar'); if(!$('#econs')) return;
    if(r.indisponivel){ c.hidden=true; indisponivel(); return; }
    if(r.timeout){ c.innerHTML='<span class="t">saída</span><span class="er">O programa não terminou em 6 segundos. Provavelmente é um loop infinito: confira se algo muda dentro do while.</span>'; return; }
    if(r.interno){ c.innerHTML=`<span class="er">${esc(r.interno)}</span>`; return; }
    c.innerHTML=`<span class="t">saída</span>${esc(r.saida||'')}${r.erro?`<span class="er">${r.saida?'\n':''}${esc(txtErro(r.erro))}\n${esc(dicaErro(r.erro))}</span>`:(r.saida?'':'<span class="t">(o programa não mostrou nada: use print para ver valores)</span>')}`; };
  $('#etestar').onclick=async()=>{ AU.init(); const cod=ed.value; S.codigos[ex.id]=cod; salvar();
    for(const [re,msg] of (ex.exige||[])) if(!new RegExp(re).test(cod)){ AU.efeito('erro'); $('#eres').innerHTML=`<div class="msg erro">${esc(msg)}</div>`; return; }
    for(const [re,msg] of (ex.proibido||[])) if(new RegExp(re).test(cod)){ AU.efeito('erro'); $('#eres').innerHTML=`<div class="msg erro">${esc(msg)}</div>`; return; }
    $('#eres').innerHTML='<div class="msg info">Rodando os testes…</div>';
    const r=await PY.rodar(cod,ex.testes,'testar'); if(!$('#eres')) return;
    if(r.indisponivel){ indisponivel(); return; }
    if(r.timeout){ falhas++; AU.efeito('erro'); $('#eres').innerHTML='<div class="msg erro">Os testes não terminaram: o programa entrou em loop infinito. Confira se a variável do while muda dentro do laço.</div>'; if(falhas>=2) $('#esol').hidden=false; return; }
    if(r.interno){ $('#eres').innerHTML=`<div class="msg erro">${esc(r.interno)}</div>`; return; }
    const ts=r.testes, ok=ts.every(t=>t.ok);
    const lista=`<ul class="testes">${ts.map(t=>`<li class="${t.ok?'ok':'er'}"><b>${t.ok?'✓':'✗'}</b><div>${esc(t.d)}${t.ok?'':t.erro?`<small>${esc(txtErro(t.erro))}${dicaErro(t.erro)?'\n'+esc(dicaErro(t.erro)):''}</small>`:t.texto?`<small>Esperado:\n${esc(t.esperado)}\nSeu programa mostrou:\n${esc(t.obtido||'(nada)')}</small>`:`<small>Esperado: ${esc(t.esperado)} · obtido: ${esc(t.obtido)}</small>`}</div></li>`).join('')}</ul>`;
    if(ok){ S.okex[ex.id]=true; salvar(); AU.efeito('sucesso'); FX.confete(90); $('#eres').innerHTML=`<div class="msg ok"><b>Todos os testes passaram!</b> É assim nas empresas: o código só segue quando os testes automáticos ficam verdes.</div>${lista}<div class="acoes"><span></span><button class="btn" id="eseguir">${esc(ctx.rotulo)}</button></div>`; $('#eseguir').onclick=()=>ctx.ok(cod,false); $('#eseguir').scrollIntoView({behavior:'smooth',block:'nearest'}); }
    else { falhas++; AU.efeito('erro'); $('#eres').innerHTML=`<div class="msg erro">${ts.filter(t=>t.ok).length} de ${ts.length} testes passaram. Leia o que falhou, ajuste e teste de novo.</div>${lista}`; if(falhas>=2) $('#esol').hidden=false; }
  };
}
function renderCodigo(p){
  const lista=EX[p.lista]; const st={i:Math.max(0,lista.findIndex(e=>!S.okex[e.id]))}; if(lista.every(e=>S.okex[e.id])) st.i=0;
  const draw=()=>{ const ex=lista[st.i];
    telaExercicio(ex,{barra:'python3 main.py', olho:`Mão na massa · exercício ${st.i+1} de ${lista.length}`,
      topo:`<div class="progex">${lista.map((e,k)=>`<i class="${S.okex[e.id]?'ok':k===st.i?'at':''}"></i>`).join('')}</div>`,
      intro: p.lista==='c1'&&st.i===0?`<div class="real"><b>Python de verdade.</b> Agora você escreve código como nas empresas. <b>▶ Rodar</b> executa e mostra o resultado. <b>✓ Testar</b> confere seu código com testes automáticos. Os botões de símbolos ajudam no celular.</div>`:'',
      rotulo: st.i<lista.length-1?'Próximo exercício ▸':'Continuar ▸',
      ok:()=>{ if(st.i<lista.length-1){ st.i++; draw(); } else proximo(); }});
  };
  draw();
}

const KW=/\b(algoritmo|inicio|fimalgoritmo|se|entao|senao|fimse|para|de|ate|faca|fimpara|enquanto|fimenquanto|funcao|fimfuncao|retorne|escreva|var|e|ou|nao|verdadeiro|falso|inteiro|real|texto|logico|vetor|def|if|else|elif|for|in|range|while|return|print|True|False|and|or|not|len)\b/;
function realce(cod){
  const re=/(\/\/[^\n]*|#[^\n]*)|("[^"\n]*"|'[^'\n]*')|(\b\d+(?:\.\d+)?\b)|([A-Za-zÀ-ú_]+)|(<-|==|!=|>=|<=|[+\-*\/%<>=])/g; let out='',last=0,m;
  while((m=re.exec(cod))){ out+=esc(cod.slice(last,m.index)); const [t,c,s,n,w,o]=m;
    if(c) out+=`<span class="c">${esc(c)}</span>`; else if(s) out+=`<span class="s">${esc(s)}</span>`; else if(n) out+=`<span class="n">${n}</span>`; else if(w) out+= KW.test(w)&&new RegExp('^'+KW.source+'$').test(w)?`<span class="k">${esc(w)}</span>`:esc(w); else if(o) out+=`<span class="o">${esc(o)}</span>`;
    last=re.lastIndex; }
  return out+esc(cod.slice(last));
}

{ id:3, dia:'Dia 3', titulo:'Operadores', sub:'Fazer contas, comparar e combinar condições.', bg:'escritorio', musica:'trabalho', buzio:{x:84,y:56,frase:'Até a noite mais longa termina com o amanhecer.'}, passos:[
  {t:'cena', bg:'escritorio', falas:[

    ['teo','O símbolo % dá o resto da divisão. 10 % 3 é 1. Parece bobo, mas é assim que se descobre se um número é par.'],
    ['kiara','Os operadores relacionais comparam: maior, menor, igual. A resposta é sempre verdadeiro ou falso.'],
    ['nina','E os lógicos juntam condições. Pensa numa porta com duas trancas: com "e", as duas precisam abrir. Com "ou", basta uma.'],
    ['bit','PORTA COM DUAS TRANCAS. TRANCA 1 VERDADEIRA E TRANCA 2 FALSA. RESULTADO: PORTA FECHADA.']
  ]},
  {t:'aula', titulo:'Operadores', paras:['Operadores são os símbolos que fazem o trabalho pesado nas expressões. Toda comparação devolve um valor lógico: verdadeiro ou falso.','Atenção a dois detalhes: um sinal de igual (=) ou a seta (<-) guarda valores; dois sinais (==) comparam. E "maior ou igual" (>=) inclui a fronteira.'],
    fatos:[['Aritméticos','+  −  *  /  e  % (resto)'],['Relacionais','==  !=  >  <  >=  <='],['Lógicos','e · ou · nao  (em Python: and · or · not)']],
    portugol:'10 % 3                   // 1, o resto\n7 / 2                    // 3.5\npacotes % 2 == 0         // verdadeiro se for par\n(peso > 1) e (peso < 5)  // as duas precisam valer\nurgente ou vip           // basta uma valer\nnao entregue             // inverte',
    python:'10 % 3                   # 1\n7 / 2                    # 3.5\npacotes % 2 == 0\n(peso > 1) and (peso < 5)\nurgente or vip\nnot entregue',
    real:'Pergunta clássica de entrevista: "como saber se um número é par?". Resposta: n % 2 == 0.'},
  {t:'vf', titulo:'Verdadeiro ou falso, rápido!', vars:{x:7,y:3}, itens:[['x % 2 == 1',true],['x > y e y > 5',false],['nao (x == 7)',false],['x + y >= 10',true],['y * 2 == x',false],['(x < 5) ou (y < 5)',true],['x % y == 1',true],['x - y * 2 == 8',false]], minimo:6},

{ id:4, dia:'Dia 4', titulo:'Decisões', sub:'Se a condição for verdadeira, faça isto. Senão, faça aquilo.', bg:'armazem', musica:'trabalho', buzio:{x:28,y:62,frase:'Não é o vento que derruba o baobá. É a raiz fraca.'}, passos:[

    ['nina','Na loja parceira, o frete é grátis para compras a partir de R$ 100. O programa precisa escolher: cobra ou não cobra.'],

    ['teo','Para repetir, usamos laços. O "para" (no Bit, o "repita") quando você sabe quantas vezes. O "enquanto" quando depende de uma condição.'],

    ['bit','LOOP INFINITO. LOOP INFINITO. LOOP INFI... BRINCADEIRA.',{fx:'tremer'}]

  {t:'aula', titulo:'Laços de repetição', paras:['Um laço executa o mesmo bloco várias vezes. Cada execução é chamada de volta (ou iteração).','O "para" usa um contador que vai de um valor inicial até um final. O "enquanto" testa a condição antes de cada volta e para quando ela fica falsa.'],
    fatos:[['para / repita','Quando você sabe quantas vezes repetir'],['enquanto','Quando depende de algo que muda durante a execução'],['Loop infinito','Quando a condição nunca fica falsa']],
    portugol:'// para: sei quantas vezes\npara i de 1 ate 3 faca\n  escreva(i)\nfimpara\n\n// enquanto: depende de uma condição\nenquanto nao chegou_na_doca() faca\n  andar()\nfimenquanto',

{ id:7, dia:'Dia 7', titulo:'Funções', sub:'Escreva uma vez, use quantas vezes precisar.', bg:'escritorio', musica:'trabalho', buzio:{x:52,y:20,frase:'Quem planta a semente hoje colhe sombra amanhã.'}, passos:[

  {t:'aula', titulo:'Funções', paras:['Uma função é um bloco de código com nome que executa uma tarefa. Para usá-la, você a chama pelo nome.','Parâmetros são os valores que a função recebe (o peso, no exemplo). O "retorne" devolve o resultado para quem chamou a função.'],
    portugol:'funcao frete(peso: real): real\n  se peso <= 2 entao\n    retorne 10\n  senao\n    retorne 10 + (peso - 2) * 3\n  fimse\nfimfuncao\n\nescreva(frete(1))   // 10',

{ id:10, dia:'Semana 1', titulo:'Textos', sub:'Parte 2 · Recortar, procurar e montar strings.', bg:'escritorio', musica:'trabalho', buzio:{x:66,y:26,frase:'Palavra dita com cuidado chega inteira ao destino.'}, passos:[
  {t:'cena', bg:'escritorio', falas:[

    ['zuri','{nome}, bem-vind{o|a} à nova fase. Crescemos rápido demais, e o sistema precisa ficar à altura.'],
    ['davi','Prazer, sou o Davi, especialista em dados. Vim de Recife para ajudar na expansão.'],
    ['davi','Primeiro problema: cada pacote tem um código de rastreio, tipo BA-2026-0042. É tudo texto, e a gente precisa recortar, procurar e formatar esses textos.'],
    ['teo','Strings! Em Python, um texto é uma sequência de caracteres. Dá para pegar cada letra pelo índice, igual numa lista.'],
    ['bit','ALERTA: 37 PEDIDOS COM O MESMO CÓDIGO. PEDIDOS FANTASMAS DETECTADOS.',{fx:'glitch'}],
    ['nina','Pedidos duplicados viram prejuízo e cliente bravo. Vamos investigar enquanto você aprende.']
  ]},
  {t:'aula', titulo:'Textos (strings)', rot:['Python','Em português'], paras:['Uma string é uma sequência de caracteres. Como numa lista, cada caractere tem um índice que começa em 0, e o -1 é o último.','Fatias pegam pedaços: texto[inicio:fim] vai do índice inicio até antes de fim. Métodos como upper(), lower(), replace() e split() transformam textos, e as f-strings montam mensagens com variáveis.'],
    fatos:[['Índice','s[0], s[-1]'],['Fatia','s[2:5], s[:2], s[-4:]'],['Métodos','upper(), lower(), split(), replace()'],['f-string','f"Olá, {nome}!"']],
    portugol:'codigo = "BA-2026-0042"\nprint(codigo[0])        # B\nprint(codigo[:2])       # BA\nprint(codigo[-4:])      # 0042\nprint(len(codigo))      # 12\nprint(codigo.lower())   # ba-2026-0042\npartes = codigo.split("-")   # ["BA", "2026", "0042"]\nnome = "Dona Lúcia"\nprint(f"Olá, {nome}!")  # Olá, Dona Lúcia!',
    python:'# Em português:\n# guarde o código de rastreio numa variável\n# mostre o primeiro caractere\n# mostre do início até antes da posição 2\n# mostre os 4 últimos caracteres\n# conte quantos caracteres o código tem\n# mostre tudo em minúsculas\n# corte o código em pedaços onde houver "-"\n# monte uma mensagem trocando {nome} pelo valor da variável',
    real:'Validar CPF, e-mail, CEP e código de produto é tarefa comum de júnior. Tudo isso é trabalho com strings.'},
  {t:'vf', titulo:'Strings: verdadeiro ou falso?', vars:{s:'"Baobá"'}, itens:[['len(s) == 5',true],['s[0] == "B"',true],['s[-1] == "a"',false],['s.upper() == "BAOBÁ"',true],['"ob" in s',true],['s.lower() == s',false],['s + "!" == "Baobá!"',true],['s[1:3] == "ao"',true]], minimo:6},
  {t:'prateleira', titulo:'Os caracteres do código', nome:'codigo', texto:true, itens:['B','A','-','0','0','4','2'], rodadas:[['py','codigo[0]',0],['py','codigo[3]',3],['py','codigo[-1]',6],['py','codigo[2]',2],['py','codigo[-3]',4]], fimTitulo:'Você domina os índices de texto', fimTexto:'Strings funcionam como listas de caracteres: o primeiro é o 0 e o -1 é o último.'},
  {t:'codigo', lista:'c10'},
  {t:'quiz', titulo:'Revisão da semana', perguntas:[
    {p:'nome = "Ana"\nO que mostra print(f"Oi, {nome}!")?', ops:['Oi, {nome}!','Oi, Ana!','Oi, nome!','Dá erro'], r:1, exp:'A f-string troca {nome} pelo valor da variável.'},
    {p:'"ob" in "Baobá" é...', ops:['True','False','Dá erro','"ob"'], r:0, exp:'O operador in procura um pedaço dentro do texto.'}

{ id:11, dia:'Semana 2', titulo:'Dicionários', sub:'Parte 2 · Encontrar dados pela chave, como num cadastro.', bg:'escritorio', musica:'trabalho', buzio:{x:18,y:58,frase:'Quem guarda o nome das coisas guarda o caminho de volta.'}, passos:[
  {t:'cena', bg:'escritorio', falas:[

    ['davi','Os pedidos chegam num arquivo CSV, que é uma planilha em formato de texto. Cada linha vira dados, e os dados vão para o dicionário.'],
    ['bit','DICIONÁRIO ATUALIZADO: O CÓDIGO BA-0042 APARECE 3 VEZES. DEVERIA APARECER 1.']
